/* Saved from the same window, but filed as knowledge rather than contact. */
function convSaveAsLearned(c){
  const o=conv.out||{};
  const src=($('cvsrc')&&$('cvsrc').value)||'Not recorded';
  c.learned=c.learned||[];
  c.learned.push({id:uid(),date:conv.date,ts:nowStamp(),src:src,
    note:o.summary||((conv._keep&&conv._keep.txt)||''),points:o.points||[],tags:convTagsFrom(o)});
  let n=0;
  pendingFacts().forEach((f,i)=>{
    const cb=$('cvf'+i);if(cb&&!cb.checked)return;
    if(f.k==='doctor'){
      c.contacts=c.contacts||[];
      if(!contacts(c).some(x=>nameEq(x.name,f.to)))c.contacts.push({id:uid(),name:f.to,role:'Doctor',phone:''});
      if(!(c.doctors||[]).some(d=>nameEq(d,f.to)))c.doctors=[...(c.doctors||[]),f.to];
    }else{c[f.k]=f.to;stampProv(c,f.k,src,conv.date);}
    n++;
  });
  (o.software||[]).forEach(s=>{if(!s||!s.name)return;c.systems=c.systems||[];
    if(!c.systems.some(x=>nameEq(x.name,s.name)))c.systems.push({id:uid(),name:s.name,cat:s.cat||'',feel:s.feel||'',src:src});});
  (o.orbit||[]).forEach(x=>{if(!x||!x.name)return;c.orbit=c.orbit||[];
    if(!c.orbit.some(y=>nameEq(y.name,x.name)))c.orbit.push({id:uid(),name:x.name,who:x.who||'',freq:x.freq||'',src:src});});
  markProfileStale(c);
  save();closeModal();conv=null;render();
  toast(n?('Noted — '+n+' field'+(n>1?'s':'')+' updated, not counted as contact'):'Noted — not counted as contact');
}
function convModeUI(){
  const learn=$('cvmlearn')&&$('cvmlearn').checked;
  if($('cvtalkbox'))$('cvtalkbox').style.display=learn?'none':'block';
  if($('cvlearnbox'))$('cvlearnbox').style.display=learn?'block':'none';
}
function convSave(){
  const o=conv.out||{},obj=conv.kind==='clinic'?S.clinics.find(c=>c.id===conv.id):S.people.find(p=>p.id===conv.id);
  if(!obj)return;
  /* ONE window, two outcomes: a conversation is contact, an observation is knowledge. */
  const asLearn=$('cvmlearn')&&$('cvmlearn').checked;
  if(asLearn&&conv.kind==='clinic'){convSaveAsLearned(obj);return;}
  obj.calls=obj.calls||[];
  const callId=uid();
  obj.calls.push({id:callId,date:conv.date,ts:nowStamp(),src:conv.src,summary:o.summary||'',points:o.points||[],
    objections:o.objections||[],pricing:o.pricing||[],nextStep:o.nextStep||'',sentiment:o.sentimentNote||'',
    tags:convTagsFrom(o)});
  let n=0,vlog=0,tlog=0;
  // visit
  if($('cvvisit')&&$('cvvisit').checked&&conv.kind==='clinic'){
    obj.visits=obj.visits||[];
    obj.visits.push({date:conv.date,time:($('cvvtime')&&$('cvvtime').value)||'',note:'',ts:nowStamp(),fromCall:callId});
    jlog('visit','Visited '+obj.name+(o.summary?' — '+o.summary.slice(0,70):''),conv.date);
    vlog=1;
  }
  // tasks
  (o.tasks||[]).forEach((t,i)=>{
    const cb=$('cvt'+i);if(cb&&!cb.checked)return;
    S.sequence.push({id:uid(),title:cleanEntry(t,false)||t,bucket:'queued',trigger:'',notes:'From conversation on '+fmtD(conv.date),link:obj.name,done:false,created:todayISO(),ts:nowStamp(),fromCall:callId});
    tlog++;
  });
  (o.commitments||[]).forEach((c,i)=>{
    const cb=$('cvc'+i);if(cb&&!cb.checked)return;
    const mine=/vinay|me|i\b/i.test(c.who||'');
    box().followups.push({id:uid(),text:c.what,who:mine?(conv.kind==='clinic'?(obj.doctors&&obj.doctors[0])||obj.name:obj.name):(c.who||obj.name),
      due:c.due||'',time:'',repeat:'none',done:false,created:todayISO(),fromCall:callId});n++;
  });
  if($('cvnext')&&$('cvnext').checked&&o.nextStep){
    S.sequence.push({id:uid(),title:o.nextStep,bucket:'now',trigger:'',notes:'From conversation on '+fmtD(conv.date),link:obj.name,done:false,created:todayISO(),ts:nowStamp(),fromCall:callId});
  }
  if($('cvstage')&&$('cvstage').checked&&o.suggestedStage&&conv.kind==='clinic'){
    obj.stageHistory.push({date:todayISO(),ts:nowStamp(),stage:o.suggestedStage});
    jlog('stage',obj.name+' → '+o.suggestedStage);
    obj.stage=o.suggestedStage;
    if(['Paying','Renewed'].includes(o.suggestedStage))celebrate();
  }
  // clinic record updates the conversation revealed
  let facts=0;
  if(conv.kind==='clinic'){
    pendingFacts().forEach((f,i)=>{
      const cb=$('cvf'+i);if(cb&&!cb.checked)return;
      if(f.k==='doctor'){
        obj.contacts=obj.contacts||[];
        if(!contacts(obj).some(x=>nameEq(x.name,f.to))){obj.contacts.push({id:uid(),name:f.to,role:'Doctor',phone:''});facts++;}
        if(!(obj.doctors||[]).some(d=>nameEq(d,f.to)))obj.doctors=[...(obj.doctors||[]),f.to];
      }else{
        obj[f.k]=f.to;stampProv(obj,f.k,'The doctor told me',conv.date);facts++;
        if(f.k==='whoAnswers'){
          obj.contacts=obj.contacts||[];
          if(!contacts(obj).some(x=>nameEq(x.name,f.to)))obj.contacts.push({id:uid(),name:f.to,role:'Receptionist',phone:obj.whoAnswersPhone||''});
        }
      }
    });
  }
  // software they mentioned
  (o.software||[]).forEach(sw=>{
    if(!sw||!sw.name||conv.kind!=='clinic')return;
    obj.systems=obj.systems||[];
    if(!obj.systems.some(x=>nameEq(x.name,sw.name)))
      obj.systems.push({id:uid(),name:sw.name,cat:SYS_CATS.includes(sw.cat)?sw.cat:'Other software',cost:'',feel:SYS_FEEL.includes(sw.feel)?sw.feel:'',notes:'From conversation '+fmtD(conv.date)});
  });
  // people who orbit the doctor
  (o.orbit||[]).forEach(ob=>{
    if(!ob||!ob.name||conv.kind!=='clinic')return;
    obj.orbit=obj.orbit||[];
    if(!obj.orbit.some(x=>nameEq(x.name,ob.name)))
      obj.orbit.push({id:uid(),name:ob.name,who:ORBIT_WHO.includes(ob.who)?ob.who:'Other',freq:ORBIT_FREQ.includes(ob.freq)?ob.freq:'Occasionally',close:'',intro:'no',notes:'Mentioned '+fmtD(conv.date)});
  });
  (o.people||[]).forEach(pp=>{
    if(!pp||!pp.name)return;
    if(!S.people.some(x=>nameEq(x.name,pp.name))&&/^dr\.?\s/i.test(pp.name)){
      const np={id:uid(),name:pp.name,role:pp.role||'Doctor',org:'',specialty:'',phone:'',city:obj.city||'',clinic:conv.kind==='clinic'?obj.name:'',source:'',influence:'',rel:'New',notes:'Mentioned in conversation '+fmtD(conv.date)};
      S.people.push(np);linkPersonClinic(np);
    }
  });
  jlog('call','Conversation logged — '+obj.name+(o.summary?': '+o.summary.slice(0,70):''),conv.date);
  const dk=conv.kind,di=conv.id;
  conv=null;closeModal();save();render();
  tidyPeople();
  if(S.meta.aiKey)setTimeout(()=>debrief(dk,di),700);
  const bits=[];
  if(vlog)bits.push('visit logged');
  if(n)bits.push(n+' follow-up'+(n>1?'s':''));
  if(tlog)bits.push(tlog+' task'+(tlog>1?'s':''));
  if(facts)bits.push(facts+' record update'+(facts>1?'s':''));
  toast('Saved'+(bits.length?' · '+bits.join(' · '):''));
}

/* ---------- DAILY COACH ----------
   Layer 1: deterministic engine scores real opportunities using Vinay's own strategy rules.
   Layer 2: Gemini sequences + explains them, grounded ONLY in these facts (cannot invent).      */
function allConvs(){
  const rows=[];
  S.clinics.forEach(c=>(c.calls||[]).forEach(v=>rows.push({who:c.name,id:c.id,kind:'clinic',obj:c,v})));
  S.people.forEach(p=>(p.calls||[]).forEach(v=>rows.push({who:p.name,id:p.id,kind:'person',obj:p,v})));
  return rows.sort((a,b)=>String(b.v.date).localeCompare(String(a.v.date)));
}
function coachCandidates(){
  const C=[],live=liveCount(),paying=payingCount();
  const push=(score,kind,action,why,act)=>C.push({score,kind,action,why,act});

  // 1. Overdue follow-ups — promises are the cheapest trust to lose
  openFU().filter(f=>f.due&&daysTo(f.due)<0).forEach(f=>{
    const d=-daysTo(f.due);
    push(100+Math.min(d*3,40),'promise','Close: '+f.text+(f.who?' ('+f.who+')':''),
      'Promised for '+fmtDs(f.due)+', now '+d+' day'+(d>1?'s':'')+' late. Slipping promises is how tier-2 relationships quietly die.',
      f.who?{t:'person',n:f.who}:null);
  });

  // 2. Active clinic, recording not verified — hard gate, blocks everything downstream
  S.clinics.filter(c=>ACTIVE_STAGES.includes(c.stage)&&c.handset!=='ok').forEach(c=>{
    push(95,'blocker','Run the recording test call at '+c.name,
      'Stage is '+c.stage+' but the test call isn\'t verified'+(c.brand?'':' and the handset brand is unknown')+'. Until this passes, DeskLens cannot produce a single call for them.',
      {t:'clinic',id:c.id});
  });

  // 3. Partial-recording handsets at active clinics — expectation risk
  S.clinics.filter(c=>ACTIVE_STAGES.includes(c.stage)&&PARTIAL_BRANDS.includes(c.brand)).forEach(c=>{
    push(80,'risk','Confirm "Record Unknown Numbers" is ON at '+c.name,
      c.brand+' captures only unknown-number incoming calls. Their data will be partial — say it before they discover it.',
      {t:'clinic',id:c.id});
  });

  // 4. Audit clinics — the 7-day window is the sales motion; it must close
  S.clinics.filter(c=>c.stage==='Audit (7-day)').forEach(c=>{
    const lv=lastVisit(c),age=lv?daysAgo(lv):null;
    push(90,'close','Take the audit results back to '+c.name,
      'Free 7-day audit is your closing motion'+(age!==null?', and it\'s been '+age+' days since you were there':'')+'. Proof in hand converts better than any pitch.',
      {t:'clinic',id:c.id});
  });

  // 5. Quiet active clinics — the field is the moat
  S.clinics.filter(c=>['Design Partner','Pilot'].includes(c.stage)).forEach(c=>{
    const lv=lastVisit(c),d=lv?daysAgo(lv):999;
    if(d>=10)push(70+Math.min(d,25),'field','Visit '+c.name+(c.doctors&&c.doctors[0]?' — '+c.doctors[0]:''),
      lv?('No visit logged in '+d+' days. Design partners go cold quietly.'):'No visit ever logged. Presence is the only thing a competitor can\'t copy.',
      {t:'clinic',id:c.id});
  });

  // 6. High-value leads never approached — where founder-time compounds
  S.clinics.filter(c=>c.stage==='Lead'&&parseInt(c.reviews||0)>=100&&!c.visits.length).forEach(c=>{
    push(60+Math.min(parseInt(c.reviews)/50,20),'growth','Approach '+c.name+' ('+c.reviews+' reviews)',
      'High review count means high call volume — the clinics that feel the missed-call problem most. Offer the free 7-day audit.',
      {t:'clinic',id:c.id});
  });

  // 7. High-influence people with nothing planned — unopened doors
  S.people.filter(p=>(p.influence||'').startsWith('High')&&!openFU().some(f=>nameEq(f.who,p.name))).forEach(p=>{
    push(65,'leverage','Line up an ask with '+p.name,
      'Marked high influence but nothing is scheduled. Referral introductions are your cheapest path to clinic 15.',
      {t:'person',id:p.id});
  });

  // 8. Karthik blockers — build velocity
  S.questions.filter(q=>q.status==='open'&&daysAgo(q.created)>=7).forEach(q=>{
    push(72,'build','Get an answer from '+q.withWhom+': '+q.q,
      'Open '+daysAgo(q.created)+' days. Architecture and compliance questions compound — every day unanswered is a day of possible rework.',
      null);
  });

  // 9. Gate awareness
  if(live<3)push(55,'gate','Push one clinic to pilot — you are at '+live+' of 3',
    'Gate 1 is three live clinics. Everything after it (partners, reps, pricing confidence) waits on this number.',null);
  else if(live<15)push(50,'gate',(15-live)+' clinics to the partner-activation gate',
    'You are at '+live+' live. Founder-direct until 15 — that is the rule that keeps distribution learnable.',null);

  // 10. Missing intelligence that shapes decisions
  const noRev=S.clinics.filter(c=>ACTIVE_STAGES.includes(c.stage)&&!c.reviews);
  if(noRev.length)push(40,'data','Look up review counts for '+noRev.length+' active clinic'+(noRev.length>1?'s':''),
    'Review count is your call-volume proxy — without it you cannot rank where to spend the next visit.',null);

  // 11. Personal world
  S.me.followups.filter(f=>!f.done&&f.due&&daysTo(f.due)<0).forEach(f=>{
    push(58,'personal','Personal: '+f.text,'Overdue since '+fmtDs(f.due)+'. Founder life leaks into founder judgement.',null);
  });

  // 11b. What conversations are telling you
  allConvs().slice(0,25).forEach(x=>{
    const v=x.v,d=daysAgo(v.date);
    // a stated next step that never became a task or follow-up
    if(v.nextStep&&d>=2){
      const done=[...S.sequence,...S.me.sequence].some(t=>t.title.toLowerCase().includes(v.nextStep.toLowerCase().slice(0,18)))
        ||allFU().some(f=>f.f.text.toLowerCase().includes(v.nextStep.toLowerCase().slice(0,18)));
      if(!done)push(78,'dropped','Nothing scheduled after '+x.who+': “'+v.nextStep+'”',
        'You named this as the next step '+d+' days ago and nothing was created. Conversations decay into nothing exactly here.',
        x.kind==='clinic'?{t:'clinic',id:x.id}:{t:'person',id:x.id});
    }
    // an objection with no follow-up since
    if((v.objections||[]).length&&d>=3&&!allFU().some(f=>nameEq(f.f.who,x.who))){
      push(68,'objection','Answer '+x.who+'’s concern: “'+v.objections[0]+'”',
        'Raised '+d+' days ago and nothing is scheduled with them. Unanswered objections harden into a no.',
        x.kind==='clinic'?{t:'clinic',id:x.id}:{t:'person',id:x.id});
    }
    // they shared recordings — the fastest proof loop you have
    if((v.tags||[]).includes('Recordings shared')&&d>=2){
      push(74,'proof','Send '+x.who+' what their recordings revealed',
        'They handed over real audio '+d+' days ago. Turning their own calls into findings is your strongest close.',
        x.kind==='clinic'?{t:'clinic',id:x.id}:{t:'person',id:x.id});
    }
  });
  // repeated feature ask across contacts
  const feat=allConvs().filter(x=>(x.v.tags||[]).includes('Feature request'));
  if(feat.length>=2)push(52,'product',feat.length+' clinics have now asked for the same kind of feature',
    'Feature requests are stacking up ('+[...new Set(feat.map(f=>f.who))].slice(0,3).join(', ')+'). Worth turning into a decision with Karthik rather than a memory.',null);
  // 11c. What their stack and their circle tell you
  S.clinics.filter(c=>ACTIVE_STAGES.includes(c.stage)||c.stage==='Lead').forEach(c=>{
    const sys=systems(c),orb=orbit(c);
    const unhappy=sys.find(s=>/Frustrat|Barely/.test(s.feel||''));
    if(unhappy)push(66,'wedge','Use their frustration with '+unhappy.name+' at '+c.name,
      'They already pay for software and are unhappy with it — budget exists and the door is open. Ask what it fails to tell them.',{t:'clinic',id:c.id});
    if(sys.some(s=>/lead gen|advertis/i.test(s.cat)))push(62,'wedge','Ask '+c.name+' what their ad and listing spend actually converts',
      'They pay for leads ('+sys.filter(s=>/lead gen|advertis/i.test(s.cat)).map(s=>s.name).join(', ')+'). Missed calls are money they have already spent — your sharpest angle.',{t:'clinic',id:c.id});
    const intro=orb.find(o=>o.intro==='yes');
    if(intro)push(58,'leverage','Ask '+intro.name+' at '+c.name+' for an introduction',
      intro.who+' who the doctor trusts and who you have marked as able to introduce you. Cheapest path to the next clinic.',{t:'clinic',id:c.id});
    if(ACTIVE_STAGES.includes(c.stage)&&!sys.length)push(38,'data','Find out what software '+c.name+' already uses',
      'What they pay for tells you their budget, where their leads come from, and what you sit beside.',{t:'clinic',id:c.id});
  });
  // 11d. The pilot clock
  (function(){
    const p=S.meta.pilot;if(!p||!p.date)return;
    const d=daysTo(p.date),blockers=pilotChecks().filter(x=>!x.done);
    if(d>=0&&d<=21&&blockers.length){
      push(d<=7?110:d<=14?88:70,'pilot','Pilot in '+d+' days — '+blockers[0].label.toLowerCase(),
        blockers.length+' item'+(blockers.length>1?'s':'')+' still open before '+fmtD(p.date)+'. This is the date everything else waits on.',
        pilotClinic()?{t:'clinic',id:pilotClinic().id}:null);
    }
    if(d<0&&blockers.length)push(115,'pilot','Pilot date has passed with '+blockers.length+' item'+(blockers.length>1?'s':'')+' open',
      'Either clear them this week or move the date honestly — a slipping date you do not move stops meaning anything.',null);
  })();
  // 12. Hygiene
  const bk=S.meta.lastBackup?daysAgo(S.meta.lastBackup):999;
  if(bk>10)push(35,'hygiene','Take a backup','Last backup '+(S.meta.lastBackup?bk+' days ago':'never')+'. Sync covers device loss, backups cover mistakes.',null);

  return C.sort((a,b)=>b.score-a.score);
}

  return {
    date:todayISO(),
    gate:{live,paying,next:live<3?3:live<8?8:live<15?15:400},

    followupsOpen:openFU().map(f=>({text:f.text,who:f.who,due:f.due,overdueDays:f.due?Math.max(0,-daysTo(f.due)):0})),
    tasksNow:S.sequence.filter(t=>t.bucket==='now'&&!t.done).map(t=>t.title),

    openQuestions:S.questions.filter(q=>q.status==='open').map(q=>({q:q.q,with:q.withWhom,ageDays:daysAgo(q.created)}))
  };
}
async function runCoach(){
  const cands=coachCandidates();
  if(!cands.length){S.meta.coach={date:todayISO(),items:[],note:'Nothing pressing — a rare clean slate. Spend the day on new leads.'};save();render();return;}
  if(!S.meta.aiKey){
    S.meta.coach={date:todayISO(),src:'rules',items:cands.slice(0,5).map(c=>({action:c.action,why:c.why,kind:c.kind,act:c.act}))};
    save();render();toast('Plan ready');return;
  }
  toast('Thinking about your day…');
  try{
    const prompt=BRAIN_BRIEF+'\n\n'
      +'Below are (A) the complete state of his command centre and (B) opportunities already detected by a rules engine, with scores. '
      +'Choose and SEQUENCE the best 4-5 actions for TODAY. Be specific — name the clinic or person and the concrete next step. '
      +'Never invent a clinic, person or fact that is not in the data. Order them the way a sharp operator would actually run the day (grouping by geography where visible, hardest-blocking first). '
      +'Return ONLY JSON: {"headline":"one sharp sentence about what today is really about","items":[{"action":"...","why":"one or two sentences of reasoning tied to his strategy","impact":"high|medium|low"}],"watch":"one risk he is not seeing","win":"one small thing that would compound if done today"}\n\n'
      +'A) STATE:\n'+JSON.stringify(brainContext())
      +'\n\nB) DETECTED OPPORTUNITIES:\n'+JSON.stringify(cands.slice(0,14).map(c=>({score:c.score,kind:c.kind,action:c.action,why:c.why})));
    const out=await gemini([{text:prompt}],{temp:0.3,prefer:'gemini-2.5-flash'});
    const items=(out.items||[]).map(it=>{
      const m=cands.find(c=>c.action.toLowerCase().slice(0,18)===String(it.action||'').toLowerCase().slice(0,18))
            ||cands.find(c=>String(it.action||'').toLowerCase().includes((c.act&&c.act.n||'').toLowerCase()));
      return {action:it.action,why:it.why,impact:it.impact,act:m?m.act:null,kind:m?m.kind:''};
    });
    S.meta.coach={date:todayISO(),src:'ai',headline:out.headline||'',items,watch:out.watch||'',win:out.win||''};
    save();render();toast('Your plan is ready');
  }catch(e){
    S.meta.coach={date:todayISO(),src:'rules',items:cands.slice(0,5).map(c=>({action:c.action,why:c.why,kind:c.kind,act:c.act}))};
    save();render();toast('Used built-in planner (AI unavailable)');
  }
}
function coachAct(i){
  const it=(S.meta.coach&&S.meta.coach.items||[])[i];
  if(!it||!it.act)return;
  if(it.act.t==='clinic'&&it.act.id)openClinic(it.act.id);
  else if(it.act.t==='person'&&it.act.id)openPerson(it.act.id);
  else if(it.act.n)navTo(it.act.n);
}
function coachToTask(i){
  const it=(S.meta.coach&&S.meta.coach.items||[])[i];if(!it)return;
  S.sequence.push({id:uid(),title:it.action,bucket:'now',trigger:'',notes:it.why||'',link:autoLink(it.action),done:false,created:todayISO()});
  save();render();toast('Added to Now ✓');
}
function coachCard(){
  const c=S.meta.coach;
  const fresh=c&&c.date===todayISO();
  if(!fresh){
    return '<div class="card" style="border-left:4px solid var(--teal);margin-bottom:12px">'
      +'<div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap">'
      +'<div><b style="font-size:15px">Plan my day</b><div class="m" style="margin-top:2px">Reads your pipeline, promises and gates — then tells you what actually matters today.</div></div>'
      +'<button class="btn sm" onclick="runCoach()">Build today\'s plan</button></div></div>';
  }
  let h='<div class="card" style="border-left:4px solid var(--teal);margin-bottom:12px">'
    +'<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px">'
    +'<b style="font-size:15px">Today\'s plan</b>'
    +'<div style="display:flex;gap:6px"><span class="pill grey">'+(c.src==='ai'?'AI':'rules')+'</span><button class="btn sm sec" onclick="runCoach()">Refresh</button></div></div>';
  if(c.headline)h+='<div style="font-family:Newsreader,serif;font-size:16px;line-height:1.4;margin-bottom:10px">'+esc(c.headline)+'</div>';
  if(!c.items.length)h+='<div class="m">'+esc(c.note||'Nothing pressing today.')+'</div>';
  h+=c.items.map((it,i)=>'<div class="item" style="box-shadow:none;margin-bottom:8px">'
    +'<div class="t" style="font-size:14px">'+(i+1)+'. '+esc(it.action)+(it.impact?' <span class="pill '+(it.impact==='high'?'red':it.impact==='medium'?'amber':'grey')+'">'+esc(it.impact)+'</span>':'')+'</div>'
    +(it.why?'<div class="m">'+esc(it.why)+'</div>':'')
    +'<div class="acts" style="margin-top:6px;justify-content:flex-start">'

  if(c.watch)h+='<div class="hl warn" style="margin-top:6px"><i class="dot"></i><div><b>Watch:</b> '+esc(c.watch)+'</div></div>';
  if(c.win)h+='<div class="hl good"><i class="dot"></i><div><b>Quiet win:</b> '+esc(c.win)+'</div></div>';

}

/* ---------- ACCOUNTS: clinic contacts live inside the clinic ---------- */
const CONTACT_ROLES=['Doctor','Partner doctor','Receptionist','Front desk staff','Clinic manager','Owner (non-doctor)','Other staff'];
const NETWORK_ROLES=['Channel partner','Commission partner','Association office-bearer','Official (KPME / IMA / DHO)','Referring doctor','Team','Vendor','Friend / personal','Other'];
/* network roles stay in People; everyone else attached to a clinic belongs to that clinic */
const NETWORK_ONLY=r=>/commission|channel|association|official|kpme|ima|dho|team|co-?founder|vendor|friend|personal/i.test(r||'');
const CLINICAL_ROLE=r=>!NETWORK_ONLY(r);
const contactRoleFor=r=>/recept|front desk/i.test(r||'')?'Receptionist':/manager/i.test(r||'')?'Clinic manager':/owner/i.test(r||'')?'Owner (non-doctor)':/staff/i.test(r||'')?'Other staff':'Doctor';
function contacts(c){return c.contacts||[];}
function primaryDoc(c){const d=contacts(c).find(x=>/doctor/i.test(x.role));return d?d.name:'';}
function contactNames(c){return contacts(c).map(x=>x.name);}
/* One-time move: clinical people become contacts inside their clinic; their conversations move with them */
function migrateToAccounts(){
  if(S.meta.accounts==='v1')return 0;
  let moved=0,convs=0;
  S.clinics.forEach(c=>{
    c.contacts=c.contacts||[];
    // doctors named on the clinic
    (c.doctors||[]).forEach(dn=>{
      if(!c.contacts.some(x=>nameEq(x.name,dn)))c.contacts.push({id:uid(),name:dn,role:'Doctor',phone:''});
    });
    // receptionist recorded on the clinic
    if(c.whoAnswers&&!c.contacts.some(x=>nameEq(x.name,c.whoAnswers)))
      c.contacts.push({id:uid(),name:c.whoAnswers,role:'Receptionist',phone:c.whoAnswersPhone||''});
  });
  // pull clinical People into their clinic, carrying everything
  const keep=[];
  S.people.forEach(p=>{
    const target=S.clinics.find(c=>c.name===p.clinic)
      ||S.clinics.find(c=>(c.doctors||[]).some(d=>nameEq(d,p.name))||nameEq(c.whoAnswers,p.name));
    if(target&&CLINICAL_ROLE(p.role)){
      let ct=target.contacts.find(x=>nameEq(x.name,p.name));
      if(!ct){ct={id:uid(),name:p.name,role:contactRoleFor(p.role),phone:''};target.contacts.push(ct);}
      if(/referral|refer/i.test(p.role||''))ct.referrer=true;
      ct.phone=ct.phone||p.phone||'';
      ct.specialty=ct.specialty||p.specialty||'';
      ct.influence=ct.influence||p.influence||'';
      ct.rel=ct.rel||p.rel||'';
      ct.notes=[ct.notes,p.notes].filter(Boolean).join(' · ');
      SEG_KEYS.forEach(k=>{if(p[k]&&!ct[k])ct[k]=p[k];});
      (p.calls||[]).forEach(v=>{target.calls=target.calls||[];target.calls.push(Object.assign({},v,{with:p.name}));convs++;});
      moved++;
    }else{
      // network person — normalise the role into the network vocabulary
      if(/design partner|doctor/i.test(p.role)&&!CLINICAL_ROLE(p.role))p.role='Referring doctor';
      if(/co-founder/i.test(p.role))p.role='Team';
      if(/official/i.test(p.role))p.role='Official (KPME / IMA / DHO)';
      if(/association/i.test(p.role))p.role='Association office-bearer';
      if(/commission/i.test(p.role))p.role='Commission partner';
      p.broughtClinics=p.broughtClinics||[];
      keep.push(p);
    }
  });
  S.people=keep;
  S.meta.accounts='v1';
  save();
  return moved;
}

async function debrief(kind,id){
  const obj=kind==='clinic'?S.clinics.find(c=>c.id===id):S.people.find(p=>p.id===id);
  if(!obj||!S.meta.aiKey)return;
  try{
    const out=await gemini([{text:BRAIN_BRIEF
      +'\n\nVinay just logged this conversation. Point out what he did NOT find out — the questions that would most change his next move, given his stage and this clinic’s state. '
      +'Be blunt and specific; no praise, no summary. Max 3 gaps. If he covered things well, say so in one line and return an empty list.\n'
      +'Return ONLY JSON: {"verdict":"one line","gaps":[{"missed":"what he did not ask or record","why":"why it matters now"}]}'
      +'\n\nCONTEXT:\n'+JSON.stringify(kind==='clinic'?clinicDossier(obj):{person:obj.name,role:obj.role,conversations:(obj.calls||[]).slice(-4)})}],
      {temp:0.35,prefer:'gemini-2.5-flash'});

      +'<div style="font-family:Newsreader,serif;font-size:16px;line-height:1.45;margin-bottom:10px">'+esc(out.verdict)+'</div>'
      +(out.gaps||[]).map((g,i)=>'<div class="item" style="box-shadow:none;margin-bottom:8px"><div class="irow"><div>'

function gapToFU(kind,id,i){
  const obj=kind==='clinic'?S.clinics.find(c=>c.id===id):S.people.find(p=>p.id===id);
  if(!obj)return;
  const g=(((obj.debrief||{}).out||{}).gaps||[])[i];if(!g)return;
  const who=kind==='clinic'?((obj.doctors&&obj.doctors[0])||obj.name):obj.name;
  const d=new Date();d.setDate(d.getDate()+3);

  save();render();toast('Follow-up created ✓');
}

/* ---------- SIGNALS: what all the conversations add up to ---------- */
async function runSignals(){
  const rows=allConvs();
  if(rows.length<2){toast('Log a few conversations first');return;}
  if(!S.meta.aiKey){alert('This needs your Gemini key — Data tab → AI power.');return;}
  toast('Reading every conversation…');
  const data=rows.slice(0,40).map(x=>({with:x.who,date:x.v.date,tags:x.v.tags||[],
    said:(x.v.summary||'').slice(0,300),points:(x.v.points||[]).slice(0,4),
    objections:x.v.objections||[],pricing:x.v.pricing||[],nextStep:x.v.nextStep||''}));
  const prompt=BRAIN_BRIEF+'\n\nBelow is every conversation he has logged with doctors, clinic staff and contacts. Find what they collectively tell him — patterns, not a summary of each. '
    +'Be specific and quote their words where useful. If the evidence is thin, say so plainly rather than inventing a pattern.\n'
    +'Return ONLY JSON: {"headline":"one sentence: what the field is really saying",'
    +'"patterns":[{"finding":"the pattern","evidence":"who said what","soWhat":"what he should do about it"}],'
    +'"pricing":"what the conversations reveal about willingness to pay, in their words",'
    +'"build":"the single feature the field is asking for most, and whether the evidence is strong enough to act on",'
    +'"blocker":"the objection most likely to cost him deals, and the answer he should prepare",'
    +'"blindspot":"something he seems not to be asking about in these conversations"}\n\nCONVERSATIONS:\n'+JSON.stringify(data);
  try{
    const out=await gemini([{text:prompt}],{temp:0.3,prefer:'gemini-2.5-flash'});
    S.meta.signals={date:todayISO(),n:rows.length,out};save();render();toast('Analysis ready');
  }catch(e){alert('Could not analyse: '+e.message);}
}
function signalsCard(){
  const s=S.meta.signals;
  if(!s)return '<div class="card" style="margin-bottom:12px;border-left:4px solid var(--teal)">'
    +'<div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap">'
    +'<div><b style="font-size:15px">What is the field telling you?</b><div class="m" style="margin-top:2px">Reads every conversation you have logged and finds the patterns — pricing reality, the feature that keeps coming up, the objection costing you deals.</div></div>'
    +'<button class="btn sm" onclick="runSignals()">Analyse</button></div></div>';
  const o=s.out||{};
  let h='<div class="card" style="margin-bottom:12px;border-left:4px solid var(--teal)">'
    +'<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px">'
    +'<b style="font-size:15px">The field is saying</b><div style="display:flex;gap:6px;align-items:center"><span class="pill grey">'+s.n+' conversations · '+fmtDs(s.date)+'</span><button class="btn sm sec" onclick="runSignals()">Refresh</button></div></div>';
  if(o.headline)h+='<div style="font-family:Newsreader,serif;font-size:16px;line-height:1.45;margin-bottom:10px">'+esc(o.headline)+'</div>';
  (o.patterns||[]).forEach(p=>{
    h+='<div class="item" style="box-shadow:none;margin-bottom:8px"><div class="t" style="font-size:13.5px">'+esc(p.finding)+'</div>'
      +(p.evidence?'<div class="m"><i>'+esc(p.evidence)+'</i></div>':'')
      +(p.soWhat?'<div class="m"><b>So:</b> '+esc(p.soWhat)+'</div>':'')+'</div>';
  });
  if(o.pricing)h+='<div class="hl info"><i class="dot"></i><div><b>Pricing:</b> '+esc(o.pricing)+'</div></div>';
  if(o.build)h+='<div class="hl good"><i class="dot"></i><div><b>Build:</b> '+esc(o.build)+'</div></div>';
  if(o.blocker)h+='<div class="hl warn"><i class="dot"></i><div><b>Biggest blocker:</b> '+esc(o.blocker)+'</div></div>';
  if(o.blindspot)h+='<div class="hl bad"><i class="dot"></i><div><b>Blind spot:</b> '+esc(o.blindspot)+'</div></div>';
  return h+'</div>';
}

function brandClass(b){if(!b)return'unknown';if(PARTIAL_BRANDS.includes(b))return'partial';if(BAD_BRANDS.includes(b))return'none';return'full';}
function repRows(){
  const f=rep.f;
  if(rep.base==='clinics'){
    return S.clinics.filter(c=>{
      if(f.stage&&c.stage!==f.stage)return false;
      if(f.activeOnly==='yes'&&!ACTIVE_STAGES.includes(c.stage))return false;
      if(f.specialty&&c.specialty!==f.specialty)return false;
      if(f.city&&c.city!==f.city)return false;
      if(f.source&&c.source!==f.source)return false;
      if(f.brand&&(f.brand==='—none—'?!!c.brand:c.brand!==f.brand))return false;
      if(f.brandClass&&brandClass(c.brand)!==f.brandClass)return false;
      if(f.handset&&c.handset!==f.handset)return false;
      if(f.minRev&&!(parseInt(c.reviews||0)>=parseInt(f.minRev)))return false;
      if(f.usesSoftware&&!(c.systems||[]).some(s=>s.name===f.usesSoftware))return false;
      if(f.hasIntro==='yes'&&!(c.orbit||[]).some(o=>o.intro==='yes'))return false;
      if(f.staleDays){
        const lv=lastVisit(c);
        if(f.staleDays==='never'){if(lv)return false;}
        else if(!(!lv||daysAgo(lv)>=parseInt(f.staleDays)))return false;
      }
      return true;
    }).map(c=>({id:c.id,type:'clinic',cols:[c.name,c.stage,c.specialty,c.city,(c.doctors||[]).join(', '),c.brand||'—',c.handset,c.reviews||'—',lastVisit(c)?daysAgo(lastVisit(c))+'d ago':'never']}));
  }
  if(rep.base==='people'){
    return S.people.filter(p=>{
      if(f.role&&p.role!==f.role)return false;
      for(const k of SEG_KEYS){if(f[k]&&p[k]!==f[k])return false;}
      if(f.influence&&p.influence!==f.influence)return false;
      if(f.rel&&p.rel!==f.rel)return false;
      if(f.city&&p.city!==f.city)return false;
      if(f.specialty&&p.specialty!==f.specialty)return false;
      if(f.source&&p.source!==f.source)return false;
      return true;
    }).map(p=>({id:p.id,type:'person',cols:[p.name,p.role,p.specialty||'—',p.clinic||'—',p.power||'—',p.aware||'—',p.driver||'—',p.influence||'—',p.rel||'—']}));
  }
  if(rep.base==='followups'){
    return allFU().filter(x=>{
      const fu=x.f;
      if(f.space&&x.sp!==f.space)return false;
      if(f.who&&(fu.who||'')!==f.who)return false;
      if(f.due==='overdue'&&!(fu.due&&daysTo(fu.due)<0))return false;
      if(f.due==='week'&&!(fu.due&&daysTo(fu.due)>=0&&daysTo(fu.due)<=7))return false;
      if(f.due==='none'&&fu.due)return false;
      return true;
    }).map(x=>({id:x.f.id,type:'fu',cols:[x.f.text,x.f.who||'—',x.f.due?fmtDs(x.f.due):'no date',x.f.time||'—',x.sp==='dl'?'DeskLens':'Personal',x.f.repeat&&x.f.repeat!=='none'?x.f.repeat:'—']}));
  }
  if(rep.base==='convs'){
    const rows=[];
    S.clinics.forEach(c=>(c.calls||[]).forEach(v=>rows.push({who:c.name,id:c.id,type:'clinic',v})));
    S.people.forEach(p=>(p.calls||[]).forEach(v=>rows.push({who:p.name,id:p.id,type:'person',v})));
    return rows.filter(r=>{
      if(f.tag&&!(r.v.tags||[]).includes(f.tag))return false;
      if(f.days&&daysAgo(r.v.date)>parseInt(f.days))return false;
      return true;
    }).sort((a,b)=>b.v.date.localeCompare(a.v.date))
      .map(r=>({id:r.id,type:r.type,cols:[fmtDs(r.v.date),r.who,(r.v.tags||[]).join(', ')||'—',(r.v.summary||'').slice(0,90),r.v.nextStep||'—']}));
  }
  // tasks
  const all=[...S.sequence.map(t=>({t,sp:'DeskLens'})),...S.me.sequence.map(t=>({t,sp:'Personal'}))];
  return all.filter(({t})=>{
    if(f.bucket&&t.bucket!==f.bucket)return false;
    if(f.done==='yes'&&!t.done)return false;
    if(f.done!=='yes'&&t.done)return false;
    if(f.link&&t.link!==f.link)return false;
    return true;
  }).map(({t,sp})=>({id:t.id,type:'task',cols:[t.title,t.bucket,t.link||'—',sp,t.trigger||'—']}));
}

function hit(txt,q){const i=(txt||'').toLowerCase().indexOf(q);if(i<0)return esc(txt||'');
  return esc(txt.slice(0,i))+'<mark style="background:#FCEBA6;padding:0 2px;border-radius:3px">'+esc(txt.slice(i,i+q.length))+'</mark>'+esc(txt.slice(i+q.length));}
function runSearch(v){
  searchQ=v;const q=(v||'').trim().toLowerCase();
  const box=$('sres');if(!box)return;
  if(q.length<2){box.innerHTML='<div class="note">Type at least 2 characters.</div>';return;}
  const R=[];
  S.clinics.forEach(c=>{
    const blob=[c.name,(c.doctors||[]).join(' '),c.city,c.specialty,c.notes,c.whoAnswers,c.phone,c.stage,c.brand,c.source].join(' ').toLowerCase();

/* ============ GENERATED CLINIC PROFILE ============
   Derived from every log, never typed. Cached on the clinic; reading it is free.
   A counter shows how many logs have landed since it was written. ================= */
function logCount(c){return ((c.calls||[]).length)+((c.learned||[]).length)+((c.visits||[]).length);}
function markProfileStale(c){ /* nothing to do — staleness is derived from the count */ }
function profileStale(c){
  const p=c.profile;
  if(!p)return null;
  const n=logCount(c)-(p.logs||0);
  return n>0?n:0;
}
async function buildProfile(id){
  const c=S.clinics.find(x=>x.id===id);if(!c)return;
  if(!S.meta.aiKey){alert('This needs your Gemini key — Data tab → AI power.');return;}
  const box=$('profbtn');if(box)box.textContent='Reading every log…';
  try{
    const out=await gemini([{text:BRAIN_BRIEF
      +'\n\nBuild Vinay\'s standing profile of ONE clinic from everything he has logged about it. '
      +'These are his private field notes — he knows his own product, price and strategy, so never restate them. '
      +'Write only what is true about THEM, drawn from the dossier. Where the record does not say, leave it out — '
      +'do not infer a personality or a motive that is not evidenced. Short lines, no marketing language. Today is '+todayISO()+'.\n'
      +'Return ONLY JSON: {'
      +'"headline":"one line — who this clinic is, as Vinay would say it to Karthik",'
      +'"who":["3-6 lines of standing fact: the people, the practice, how the front desk runs, what they already use"],'
      +'"drives":"what this doctor actually wants, in his own terms, with the evidence in brackets",'
      +'"state":"where the deal really stands right now, one or two sentences",'
      +'"blocker":"the real thing in the way — say plainly if the stated objection differs from the real one, or empty if none",'
      +'"open_loops":["anything promised in either direction that is still open, with how old it is"],'
      +'"changed":["what has changed since the previous logs — leave empty if nothing has"],'
      +'"unknown":["facts missing from the record that would change how he sells to them"],'
      +'"next":"the single next move, concrete enough to do tomorrow",'
      +'"evidence":["date — the specific log line that each major claim rests on, 3-5 items"]}'
      +'\n\nDOSSIER:\n'+JSON.stringify(clinicDossier(c))}],{temp:0.3,prefer:'gemini-2.5-flash'});
    c.profile={at:nowStamp(),logs:logCount(c),out:(out&&out.json)?out.json:out};
    save();render();toast('Profile written ✓');
  }catch(e){toast('Could not build it: '+e.message);render();}
}

  const total=entries.reduce((a,b)=>a+b[1],0)||1;
  let acc=0;const R=42,C=2*Math.PI*R;
  const segs=entries.map((e,i)=>{
    const frac=e[1]/total;const dash=frac*C;const off=-acc*C;acc+=frac;
    return '<circle r="'+R+'" cx="60" cy="60" fill="none" stroke="'+SPECCOLORS[i%8]+'" stroke-width="16" stroke-dasharray="'+dash+' '+(C-dash)+'" stroke-dashoffset="'+off+'" transform="rotate(-90 60 60)"/>';
  }).join('');
  h+='<div class="grid g2"><div class="card"><h2 style="margin-top:0">Specialty mix</h2><div style="display:flex;align-items:center;gap:16px;flex-wrap:wrap">'
    +'<svg width="120" height="120" viewBox="0 0 120 120">'+segs+'<text x="60" y="65" text-anchor="middle" font-size="20" font-weight="700" fill="#1C1917">'+total+'</text></svg>'
    +'<div class="legend" style="flex-direction:column;align-items:flex-start;gap:6px">'+entries.map((e,i)=>'<span><i style="background:'+SPECCOLORS[i%8]+'"></i>'+esc(e[0])+' \u00b7 '+e[1]+'</span>').join('')+'</div>'

function vFuEngine(){
  const all=allFU().sort((a,b)=>(a.f.due||'9999').localeCompare(b.f.due||'9999'));
  const g={over:[],today:[],tmrw:[],week:[],later:[],none:[]};
  all.forEach(x=>{
    if(!x.f.due)g.none.push(x);
    else{const d=daysTo(x.f.due);
      if(d<0)g.over.push(x);else if(d===0)g.today.push(x);else if(d===1)g.tmrw.push(x);else if(d<=7)g.week.push(x);else g.later.push(x);}
  });
  const closed7=[...S.followups,...S.me.followups].filter(f=>f.done).length;

/* ---------- WEEKLY REVIEW ---------- */
function startReview(){reviewState={step:0};render();window.scrollTo(0,0);}
function reviewSteps(){
  return [
    {key:'intro',title:'Weekly Review',sub:'Five short passes. Act on each item or consciously let it wait \u2014 both are decisions.'},
    {key:'fu',title:'Follow-ups',sub:'Overdue and dateless follow-ups. Done, push +3 days, or edit.'},
    {key:'inbox',title:'Inbox',sub:'Sort every note: make it a task, a follow-up, or let it go.'},
    {key:'now',title:'Stale Now items',sub:'In \u201cNow\u201d for over 7 days. Still truly now? Finish it, or move it honestly to Queued.'},
    {key:'pipe',title:'Quiet clinics',sub:'Active clinics with no visit in 10+ days. The field is the moat \u2014 who gets a visit this week?'},
    {key:'q',title:'Open questions',sub:'Anything here answerable this week? Resolve what you can.'},
    {key:'end',title:'Done \u2014 week closed',sub:'Take a backup now and you\u2019re fully safe.'}
  ];
}
function nextReview(d){reviewState.step+=d;if(reviewState.step<0)reviewState.step=0;render();window.scrollTo(0,0);}
function finishReview(){S.meta.lastReview=todayISO();save();reviewState=null;toast('Week closed \u2713');render();}
function vReview(){
  const steps=reviewSteps();const st=steps[reviewState.step];
  let body='';
  if(st.key==='intro'){
    const H=highlights();
    body=(H.length?H.map(x=>'<div class="hl '+x[0]+'"><i class="dot"></i><div>'+x[1]+'</div></div>').join(''):'<div class="empty">All clear \u2014 quick week.</div>');
  }
  if(st.key==='fu'){
    const list=openFU().filter(f=>!f.due||daysTo(f.due)<=0);
    body=list.length?list.map(f=>fuItem(f)).join(''):'<div class="empty">Nothing overdue \u2713</div>';
  }
  if(st.key==='inbox'){
    body=box().inbox.length?box().inbox.map(n=>'<div class="item"><div class="irow"><div class="t" style="font-weight:400">'+esc(n.text)+'</div><div class="acts"><button onclick="inboxTo(\''+n.id+'\',\'task\')">\u2192 Task</button><button onclick="inboxTo(\''+n.id+'\',\'fu\')">\u2192 Follow-up</button><button onclick="delInbox(\''+n.id+'\')">Let go</button></div></div></div>').join(''):'<div class="empty">Inbox zero \u2713</div>';
  }
  if(st.key==='now'){
    const list=box().sequence.filter(x=>x.bucket==='now'&&!x.done&&daysAgo(x.created)>7);
    body=list.length?list.map(x=>'<div class="item"><div class="irow"><div><div class="t">'+esc(x.title)+'</div><div class="m">in Now for '+daysAgo(x.created)+' days</div></div><div class="acts"><button class="pri" onclick="doneSeq(\''+x.id+'\')">Done \u2713</button><button onclick="demote(\''+x.id+'\')">\u2192 Queued</button><button onclick="editSeq(\''+x.id+'\')">Edit</button></div></div></div>').join(''):'<div class="empty">Nothing stale in Now \u2713</div>';
  }
  if(st.key==='pipe'){
    const list=S.clinics.filter(c=>['Design Partner','Pilot','Audit (7-day)'].includes(c.stage)).filter(c=>{const lv=lastVisit(c);return !lv||daysAgo(lv)>=10;});
    body=list.length?list.map(c=>'<div class="item"><div class="irow"><div><div class="t">'+esc(c.name)+'</div><div class="m">'+(lastVisit(c)?'last visit '+daysAgo(lastVisit(c))+'d ago':'no visits logged')+'</div></div><div class="acts"><button class="pri" onclick="logVisit(\''+c.id+'\')">+ Visit</button><button onclick="addFUfor(\''+c.id+'\',\'clinic\')">Plan follow-up</button></div></div></div>').join(''):'<div class="empty">Every active clinic touched recently \u2713</div>';
  }
  if(st.key==='q'){
    const list=S.questions.filter(q=>q.status==='open');
    body=list.length?list.map(q=>'<div class="item"><div class="irow"><div><div class="t">'+esc(q.q)+'</div><div class="m">with '+esc(q.withWhom)+' \u00b7 open '+daysAgo(q.created)+'d</div></div><div class="acts"><button class="pri" onclick="resolveQ(\''+q.id+'\')">Resolve</button></div></div></div>').join(''):'<div class="empty">No open questions \u2713</div>';
  }
  if(st.key==='end'){
    body='<div class="hl good"><i class="dot"></i><div>Review complete. One tap left: backup.</div></div><button class="btn" onclick="doBackup()">\u2b07 Backup now</button>';
  }
  const last=reviewState.step===steps.length-1;
  return '<div class="rwrap">'
    +'<div class="rprog">'+steps.map((s,i)=>'<i class="'+(i<=reviewState.step?'on':'')+'"></i>').join('')+'</div>'
    +'<div class="rhead">'+esc(st.title)+'</div><div class="rsub">'+esc(st.sub)+'</div>'
    +body
    +'<div class="mbtns" style="max-width:420px">'
    +(reviewState.step>0?'<button class="btn sec" onclick="nextReview(-1)">\u2190 Back</button>':'<button class="btn sec" onclick="go(\'today\')">Exit</button>')
    +(last?'<button class="btn" onclick="finishReview()">Finish \u2713</button>':'<button class="btn" onclick="nextReview(1)">Next \u2192</button>')
    +'</div></div>';
}

function delInbox(id){box().inbox=box().inbox.filter(n=>n.id!==id);save();render();}
function inboxTo(id,kind){
  const n=box().inbox.find(x=>x.id===id);if(!n)return;
  if(kind==='task'){box().sequence.push({id:uid(),title:n.text,bucket:'queued',trigger:'',notes:'',link:autoLink(n.text),done:false,created:todayISO()});box().inbox=box().inbox.filter(x=>x.id!==id);save();render();toast('Queued \u2713');}
  else{
    openModal('Make follow-up',[

      {key:'who',label:'With whom',value:''},

    ],v=>{
      if(!v.text)return;
      box().followups.push({id:uid(),text:v.text,who:v.who,due:v.due,done:false,created:todayISO()});
      box().inbox=box().inbox.filter(x=>x.id!==id);save();render();toast('Follow-up \u2713');
    });
  }
}
function fuBox(sp){return (sp||space)==='dl'?S:S.me;}
function fuFind(id,sp){return fuBox(sp).followups.find(x=>x.id===id);}
function advanceDue(due,repeat){
  const d=due?new Date(due+'T00:00'):new Date();
  if(repeat==='daily')d.setDate(d.getDate()+1);
  else if(repeat==='weekly')d.setDate(d.getDate()+7);
  else if(repeat==='monthly')d.setMonth(d.getMonth()+1);
  return isoOf(d);
}
function fuDone(id,sp){
  const b=fuBox(sp);const f=b.followups.find(x=>x.id===id);f.done=true;
  if(f.repeat&&f.repeat!=='none'){
    b.followups.push({id:uid(),text:f.text,who:f.who,due:advanceDue(f.due,f.repeat),repeat:f.repeat,done:false,created:todayISO()});
    toast('Closed \u2713 \u2014 next one scheduled');
  }else toast('Closed \u2713');
  save();render();
}
function fuSnoozeN(id,days,sp){
  const f=fuFind(id,sp);
  const base=f.due&&daysTo(f.due)>0?new Date(f.due+'T00:00'):new Date();
  base.setDate(base.getDate()+days);f.due=isoOf(base);
  save();render();toast('Pushed to '+fmtDs(f.due));
}
function whoOptions(){
  const names=new Set(['']);
  S.people.forEach(p=>names.add(p.name));
  S.clinics.forEach(c=>{(c.doctors||[]).forEach(d=>names.add(d));});
  return [...names];
}

  const b=fuBox(sp);
  const f=id?b.followups.find(x=>x.id===id):{text:'',who:'',due:todayISO(),repeat:'none'};
  const whoOpts=whoOptions();

    {key:'who',label:'\u2026or type a new name',value:''},
    {key:'due',label:'Due date',type:'date',value:f.due},
    {key:'time',label:'Time (optional \u2014 enables calendar reminder)',type:'time',value:f.time||''},

}
/* ---------- NOTIFICATIONS ---------- */
function icsEvent(uid,dateISO,time,title,desc,rrule){
  const t=(time||'10:00').replace(':','');
  const d=dateISO.replace(/-/g,'');
  const endH=String(Math.min(23,parseInt(t.slice(0,2))+1)).padStart(2,'0');
  return 'BEGIN:VEVENT\r\nUID:'+uid+'@desklenshq\r\nDTSTART:'+d+'T'+t+'00\r\nDTEND:'+d+'T'+endH+t.slice(2)+'00\r\n'
    +(rrule?'RRULE:'+rrule+'\r\n':'')
    +'SUMMARY:'+String(title).replace(/[,;\\]/g,' ')+'\r\n'
    +(desc?'DESCRIPTION:'+String(desc).replace(/[,;\\]/g,' ')+'\r\n':'')
    +'BEGIN:VALARM\r\nTRIGGER:-PT30M\r\nACTION:DISPLAY\r\nDESCRIPTION:'+String(title).replace(/[,;\\]/g,' ')+'\r\nEND:VALARM\r\nEND:VEVENT\r\n';
}
function icsDownload(body,name){
  const blob=new Blob(['BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//DeskLensHQ//EN\r\nCALSCALE:GREGORIAN\r\n'+body+'END:VCALENDAR'],{type:'text/calendar'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();URL.revokeObjectURL(a.href);
}
function exportFUs(range){
  const list=allFU().filter(x=>{
    if(!x.f.due)return false;
    const d=daysTo(x.f.due);
    return range==='today'?d<=0:d<=7;
  });
  if(!list.length){toast('Nothing due '+(range==='today'?'today':'this week'));return;}
  let body='';
  list.forEach(x=>{body+=icsEvent(x.f.id,daysTo(x.f.due)<0?todayISO():x.f.due,x.f.time,x.f.text+(x.f.who?' — '+x.f.who:''),(x.sp==='dl'?'DeskLens':'Personal')+' follow-up');});
  icsDownload(body,'desklens-followups-'+range+'-'+todayISO()+'.ics');
  toast(list.length+' reminder'+(list.length>1?'s':'')+' → open the file to add them');
}
function dailyReminder(){
  openModal('Daily reminder',[
    {key:'time',label:'What time each day?',type:'time',value:'09:00'},
    {key:'days',label:'Which days?',type:'select',options:['Every day','Weekdays only'],value:'Every day'}
  ],v=>{
    const rrule=v.days==='Weekdays only'?'FREQ=WEEKLY;BYDAY=MO,TU,WE,TH,FR':'FREQ=DAILY';
    icsDownload(icsEvent('dailyhq','20260818'.replace(/(\d{4})(\d{2})(\d{2})/,'$1-$2-$3').replace(/-/g,'-')===''?todayISO():todayISO(),v.time,'DeskLens HQ — check the day','Open your plan, follow-ups and inbox',rrule),'desklens-daily-reminder.ics');
    toast('Open the file to add the daily alarm');
  },null,'Create reminder');
}
async function enableNotifs(){
  if(!('Notification' in window)){alert('This browser can’t show notifications. The calendar route works everywhere — use “Send to calendar”.');return;}
  const p=await Notification.requestPermission();
  S.meta.notif=(p==='granted');save();render();
  if(p==='granted'){new Notification('DeskLens HQ',{body:'Notifications are on. You’ll be nudged about anything overdue while the app is open.',icon:'./icon-192.png'});}
  else toast('Permission denied — you can change it in site settings');
}
function notifyDue(){
  if(!S.meta.notif||!('Notification' in window)||Notification.permission!=='granted')return;
  const today=todayISO();
  if(S.meta.notifDate===today)return;                      // once a day
  const od=allFU().filter(x=>x.f.due&&daysTo(x.f.due)<0);
  const due=allFU().filter(x=>x.f.due&&daysTo(x.f.due)===0);
  if(!od.length&&!due.length)return;
  const parts=[];
  if(od.length)parts.push(od.length+' overdue');
  if(due.length)parts.push(due.length+' due today');
  try{
    new Notification('DeskLens HQ — '+parts.join(', '),{
      body:(od[0]||due[0]).f.text+((od[0]||due[0]).f.who?' · '+(od[0]||due[0]).f.who:''),
      icon:'./icon-192.png',tag:'dlhq-due'

const LINK_STOP=['hospital','clinic','practice','centre','center','dental','skin','care','city','multi','speciality','specialty'];
function autoLink(text){
  const lo=text.toLowerCase();
  for(const c of S.clinics){
    const words=c.name.toLowerCase().split(/[^a-z]+/).filter(w=>w.length>3&&!LINK_STOP.includes(w));

}

   “Record Unknown Numbers” is ON — but ONLY unknown numbers, incoming calls.
   All other supported brands record ALL calls, incoming and outgoing. */
const PARTIAL_BRANDS=['Motorola','Google Pixel'];
const BAD_BRANDS=['iPhone','Stock Android / other'];
const ACTIVE_STAGES=['Audit (7-day)','Design Partner','Pilot','Paying','Renewed'];
function editClinic(id){
  if(!id)return openForm('clinic');
  const c=S.clinics.find(x=>x.id===id);
  const oldStage=c.stage;
  openModal(id?'Edit clinic':'Add clinic',[
    {key:'name',label:'Clinic name',value:c.name},
    {key:'doctors',label:'Doctors at this clinic (tap to connect, or type)',type:'tags',options:S.people.filter(p=>/doctor|design partner/i.test(p.role||'')).map(p=>p.name),value:(c.doctors||[]).join(', ')},
    {key:'specialty',label:'Specialty',type:'select',kind:'specialty',value:c.specialty},
    {key:'city',label:'City',type:'select',kind:'city',value:c.city},
    {key:'stage',label:'Stage',type:'select',kind:'stage',value:c.stage},
    {key:'source',label:'How this clinic came to you',type:'select',kind:'source',allowBlank:true,value:c.source||''},
    {key:'broughtBy',label:'Who introduced you',type:'select',options:['',...referrerNames()],value:c.broughtBy||''},
    {key:'phone',label:'Clinic reception number (the line patients call)',type:'tel',value:c.phone||''},
    {key:'reviews',label:'Google review count (call-volume proxy)',type:'number',value:String(c.reviews||'')},
    {key:'whoAnswers',label:'Receptionist — who answers the phone',value:c.whoAnswers||''},
    {key:'whoAnswersPhone',label:'Receptionist’s mobile',type:'tel',value:c.whoAnswersPhone||''},
    {key:'brand',label:'Clinic handset brand (determines recording capability)',type:'select',kind:'brand',allowBlank:true,value:c.brand},
    {key:'handset',label:'Handset recording check (test call done?)',type:'select',options:['unverified','ok','fail'],value:c.handset},
    {key:'consent',label:'DPDP consent (Doc #1)',type:'select',options:['not started','sent','signed'],value:c.consent||'not started'},
    {key:'notes',label:'Notes (objections, promises\u2026)',type:'textarea',value:c.notes}
  ],v=>{
    if(!v.name)return;
    if(ACTIVE_STAGES.includes(v.stage)){
      const missing=[];
      if(!v.brand)missing.push('handset brand');
      if(v.handset==='unverified')missing.push('recording check');
      if(!v.reviews)missing.push('review count');
      if(missing.length&&!confirm('This clinic is active but missing: '+missing.join(' + ')+'.\nThis info decides whether DeskLens can work there and how valuable it is.\n\nSave anyway?'))return;
    }
    if(BAD_BRANDS.includes(v.brand)&&v.handset==='ok'&&!confirm(v.brand+' cannot do OS-level call recording \u2014 but check is marked OK. Sure?'))return;
    if(PARTIAL_BRANDS.includes(v.brand)&&!confirm(v.brand+': recording works ONLY with \u201cRecord Unknown Numbers\u201d turned ON \u2014 and covers only unknown-number INCOMING calls. Outgoing and saved contacts are NOT captured.\n\nConfirm the setting is on at this clinic. Continue?'))return;
    lastCity=v.city||lastCity;
    const oldName=c.name;
    v.doctors=(v.doctors||'').split(',').map(x=>x.trim()).filter(Boolean);
    Object.assign(c,v);
    renameClinicRefs(oldName,c.name);
    if(v.stage!==oldStage){
      c.stageHistory.push({date:todayISO(),ts:nowStamp(),stage:v.stage});jlog('stage',c.name+' \u2192 '+v.stage);
      if(v.stage==='Paying'||v.stage==='Renewed')celebrate();
    }
    linkClinicDoctor(c);
    linkClinicStaff(c);
    save();render();
  },id?()=>{bin('clinics',S.clinics.find(x=>x.id===id),null);S.clinics=S.clinics.filter(x=>x.id!==id);save();render();toast('Moved to Recover — nothing is gone');}:null);
}

function qOptions(text){
  const t=(text||'');
  // "A or B?" / "A vs B" \u2014 offer each side as a tap-able answer
  const m=t.match(/([A-Za-z0-9][\w .\/+-]{1,40}?)\s+(?:or|vs\.?|versus)\s+([A-Za-z0-9][\w .\/+-]{1,40}?)\s*[?\u2014-]/i)
        ||t.match(/([A-Za-z0-9][\w .\/+-]{1,40}?)\s+(?:or|vs\.?|versus)\s+([A-Za-z0-9][\w .\/+-]{1,40})/i);
  const out=[];
  if(m){out.push(m[1].trim(),m[2].trim());}
  if(/\?$/.test(t.trim())&&!out.length)out.push('Yes','No');
  return out;
}
function resolveQ(id){
  const q=S.questions.find(x=>x.id===id);
  const opts=qOptions(q.q);
  const m=$('modal');
  const commonList=['Yes','No','Decided \u2014 see note','Dropped / not needed','Deferred'];
  const chips=[...new Set([...opts,...commonList])];
  m.innerHTML='<h3>Resolve</h3>'
    +'<div class="note" style="margin-bottom:10px">'+esc(q.q)+'</div>'
    +'<div class="subtle" style="margin-bottom:4px">Tap the answer</div>'
    +'<div class="chips" id="qchips">'+chips.map(o=>'<button onclick="pickQAns(this)">'+esc(o)+'</button>').join('')+'</div>'
    +'<div class="f"><label>Answer (edit or add detail)</label><textarea id="qres" style="min-height:60px"></textarea></div>'
    +'<div class="f"><label>Also add to decision log?</label><select id="qlog"><option value="yes">yes</option><option value="no">no</option></select></div>'
    +'<div class="mbtns"><button class="btn sec" onclick="closeModal()">Cancel</button><button class="btn" onclick="saveQRes(\''+id+'\')">Resolve \u2713</button></div>';
  $('overlay').classList.add('open');
}

function doRestore(inp){
  const f=inp.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=e=>{
    try{

      if(!d.sequence||!d.decisions)throw new Error('Not a DeskLens HQ backup');
      S=migrate(d);save();render();toast('Restored \u2713');
    }catch(err){alert('Could not restore: '+err.message);}

  r.readAsText(f);inp.value='';
}

/* Self-update: detect a newer version on the server and offer one-tap refresh */
async function checkUpdate(){
  if(!location.protocol.startsWith('http'))return;
  try{
    const r=await fetch(location.pathname+'?v='+Date.now(),{cache:'no-store'});
    const t=await r.text();
    const m=t.match(/const APP_VERSION='([\d.]+)'/);
    if(m&&m[1]!==APP_VERSION){
      const b=document.createElement('div');
      b.style.cssText='position:fixed;left:0;right:0;bottom:0;background:var(--teal);color:#fff;padding:calc(12px + env(safe-area-inset-bottom)) 16px 12px;display:flex;justify-content:space-between;align-items:center;gap:12px;z-index:400;font-size:14px';
      b.innerHTML='<span>Version '+m[1]+' is available</span><button class="btn" style="background:#fff;color:var(--teal-dark);padding:8px 14px" onclick="forceUpdate()">Update now</button>';
      document.body.appendChild(b);
    }
  }catch(e){}
}
async function forceUpdate(){
  try{
    if('serviceWorker' in navigator){
      const regs=await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map(r=>r.unregister()));
    }
    if(window.caches){
      const ks=await caches.keys();
      await Promise.all(ks.map(k=>caches.delete(k)));
    }
  }catch(e){}
  location.replace(location.pathname+'?u='+Date.now());
}
/* PWA: install as a real app on Android/desktop */
const IS_IOS=/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
if('serviceWorker' in navigator&&location.protocol.startsWith('http')){
  if(IS_IOS){
    /* iOS caches too aggressively and strands old builds — run cache-free there, always fresh */
    navigator.serviceWorker.getRegistrations().then(rs=>rs.forEach(r=>r.unregister())).catch(()=>{});
    if(window.caches)caches.keys().then(ks=>ks.forEach(k=>caches.delete(k))).catch(()=>{});
  }else{
    navigator.serviceWorker.register('./sw.js').catch(()=>{});
  }
}
