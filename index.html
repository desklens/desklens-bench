<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>DeskLens HQ — Vinay's Command Center</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#1D5B53">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="DeskLens HQ">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400..700;1,6..72,400..700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --teal:#1D5B53; --teal-dark:#143F3A; --teal-soft:#E4EFEC; --teal-mid:#2E7A6F;
  --sand:#FAF9F5; --card:#FFFFFF; --ink:#1C1B18; --muted:#6B675E;
  --line:#E4DFD3; --amber:#B4711F; --amber-soft:#F6EBDB;
  --red:#A23B2E; --red-soft:#F5E4E0; --green:#2F6B3C; --green-soft:#E5EFE4;
  --violet:#5B4B8A; --violet-soft:#EAE7F2;
  --r:16px; --sh:0 1px 3px rgba(28,27,24,.06),0 4px 14px rgba(28,27,24,.04);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%;text-size-adjust:100%;font-size:100%}
body{font-family:'Inter',system-ui,-apple-system,sans-serif;background:var(--sand);color:var(--ink);min-height:100vh;padding-bottom:calc(110px + env(safe-area-inset-bottom));-webkit-text-size-adjust:100%;overscroll-behavior-y:contain}
h2,.logo,.rhead,.modal h3{font-family:'Newsreader',Georgia,serif}
.stat .v{font-family:'IBM Plex Mono',monospace}
header{background:var(--teal-dark);color:#fff;padding:calc(12px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) 0 calc(16px + env(safe-area-inset-left));position:sticky;top:0;z-index:50;box-shadow:0 2px 12px rgba(11,79,74,.25)}
.hrow{display:flex;align-items:center;justify-content:space-between;max-width:1100px;margin:0 auto}
.logo{font-weight:700;font-size:19px;letter-spacing:.2px}
.logo span{opacity:.65;font-weight:400}
.hdate{font-size:12px;opacity:.7}
nav{display:flex;gap:2px;overflow-x:auto;max-width:1100px;margin:10px auto 0;-webkit-overflow-scrolling:touch;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{flex-shrink:0;background:none;border:none;color:#fff;opacity:.6;font-family:inherit;font-size:14px;font-weight:600;padding:10px 13px;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap;transition:opacity .15s}
nav button.active{opacity:1;border-bottom-color:#fff}
main{max-width:1100px;margin:0 auto;padding:16px calc(16px + env(safe-area-inset-right)) 16px calc(16px + env(safe-area-inset-left));animation:fadein .25s ease}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
h2{font-size:19px;font-weight:600;margin:20px 0 10px;display:flex;align-items:center;gap:8px}
.greet{font-family:'Newsreader',Georgia,serif;font-size:24px;font-weight:600;margin-bottom:2px}
.greetsub{font-size:13px;color:var(--muted);margin-bottom:12px}
.conf{position:fixed;inset:0;pointer-events:none;z-index:300;overflow:hidden}
.conf span{position:absolute;top:-30px;font-size:22px;animation:confall 1.6s ease-in forwards}
@keyframes confall{to{transform:translateY(105vh) rotate(360deg);opacity:.7}}
h2:first-child{margin-top:2px}
h2 .cnt{background:#EFEBE2;color:var(--muted);border-radius:99px;padding:1px 9px;font-size:11.5px;font-weight:600}
.grid{display:grid;gap:12px}
.g4{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:var(--sh)}
.stat .v{font-size:27px;font-weight:700;color:var(--teal)}
.stat .l{font-size:12px;color:var(--muted);margin-top:2px}
.stat.warn .v{color:var(--amber)}
.pill{display:inline-block;font-size:11px;font-weight:600;padding:2px 9px;border-radius:99px;background:var(--teal-soft);color:var(--teal-dark)}
.pill.amber{background:var(--amber-soft);color:var(--amber)}
.pill.red{background:var(--red-soft);color:var(--red)}
.pill.green{background:var(--green-soft);color:var(--green)}
.pill.grey{background:#EFEBE2;color:var(--muted)}
.pill.violet{background:var(--violet-soft);color:var(--violet)}
.item{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-bottom:10px;box-shadow:var(--sh);transition:transform .1s}
.item:active{transform:scale(.995)}
.item .t{font-weight:600;font-size:14.5px;line-height:1.35}
.item .m{font-size:12.5px;color:var(--muted);margin-top:4px;line-height:1.45;white-space:pre-wrap}
.irow{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.acts{display:flex;gap:6px;flex-shrink:0;flex-wrap:wrap;justify-content:flex-end}
.acts button{background:none;border:1px solid var(--line);border-radius:9px;font-size:12px;padding:5px 10px;cursor:pointer;color:var(--muted);font-family:inherit;transition:all .15s}
.acts button:hover{border-color:var(--teal);color:var(--teal)}
.acts button.pri{background:var(--teal);border-color:var(--teal);color:#fff}
.btn{background:var(--teal);color:#fff;border:none;border-radius:12px;font-family:inherit;font-size:14px;font-weight:600;padding:11px 18px;cursor:pointer;transition:transform .1s,opacity .15s}
.btn:active{transform:scale(.97)}
.btn.sec{background:var(--card);color:var(--teal-dark);border:1.5px solid var(--teal)}
.btn.sm{font-size:12.5px;padding:7px 13px;border-radius:9px}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:8px}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px;align-items:start}
.colh{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
.colh .cnt{background:#EFEBE2;color:var(--muted);border-radius:99px;padding:1px 8px;font-size:11px}
.now .colh{color:var(--red)}
.queued .colh{color:var(--amber)}
.parked .colh{color:var(--muted)}
.gatebar{height:12px;background:#EFEBE2;border-radius:99px;overflow:hidden;margin:8px 0 6px}
.gatebar .fill{height:100%;background:linear-gradient(90deg,var(--teal),var(--teal-mid));border-radius:99px;transition:width .6s ease}
.gmarks{display:flex;justify-content:space-between;font-size:11px;color:var(--muted)}
.empty{color:var(--muted);font-size:13px;padding:18px;text-align:center;border:1.5px dashed var(--line);border-radius:var(--r)}
.overlay{position:fixed;inset:0;background:rgba(28,25,23,.45);display:none;align-items:flex-end;justify-content:center;z-index:100}
.overlay.open{display:flex}
.modal{background:var(--card);border-radius:20px 20px 0 0;width:100%;max-width:560px;max-height:88vh;overflow-y:auto;padding:20px 18px calc(30px + env(safe-area-inset-bottom));animation:slideup .22s ease;-webkit-overflow-scrolling:touch}
@keyframes slideup{from{transform:translateY(40px);opacity:.6}to{transform:none;opacity:1}}
@media(min-width:640px){.overlay{align-items:center}.modal{border-radius:20px}}
.modal h3{font-size:17px;margin-bottom:14px}
.f{margin-bottom:12px}
.f label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:4px}
.f input,.f select,.f textarea{width:100%;font-family:inherit;font-size:15px;padding:11px;border:1.5px solid var(--line);border-radius:11px;background:#FDFCF9;color:var(--ink)}
.f textarea{min-height:74px;resize:vertical}
.f input:focus,.f select:focus,.f textarea:focus{outline:none;border-color:var(--teal)}
.mbtns{display:flex;gap:10px;margin-top:16px}
.mbtns .btn{flex:1}
.note{font-size:12px;color:var(--muted);line-height:1.5;margin-top:8px}
.dleft{border-left:4px solid var(--teal);padding-left:12px}
.toast{position:fixed;bottom:calc(96px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:11px;font-size:13.5px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:200}
.toast.show{opacity:1}
.hl{border-radius:var(--r);padding:11px 14px;font-size:13px;margin-bottom:8px;display:flex;gap:10px;align-items:flex-start;line-height:1.45}
.hl .dot{width:8px;height:8px;border-radius:99px;margin-top:5px;flex-shrink:0}
.hl.warn{background:var(--amber-soft);color:#7C4A0A}.hl.warn .dot{background:var(--amber)}
.hl.bad{background:var(--red-soft);color:#8A1A1A}.hl.bad .dot{background:var(--red)}
.hl.good{background:var(--green-soft);color:#14532D}.hl.good .dot{background:var(--green)}
.hl.info{background:var(--teal-soft);color:var(--teal-dark)}.hl.info .dot{background:var(--teal)}
.filterrow{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.filterrow button{background:var(--card);border:1px solid var(--line);border-radius:99px;font-size:12.5px;padding:6px 13px;cursor:pointer;font-family:inherit;color:var(--muted);transition:all .15s}
.filterrow button.on{background:var(--teal);border-color:var(--teal);color:#fff}
.subtle{font-size:12px;color:var(--muted)}
.dropover{outline:2px dashed var(--teal);outline-offset:5px;border-radius:var(--r)}
.dropbefore{box-shadow:0 -3px 0 0 var(--teal),var(--sh)!important}
/* native-app feel */
.f input,.f select,.f textarea,.qadd input{font-size:16px}
button,a,.item{-webkit-touch-callout:none}
.item .t,.sqt,nav button,.chips button,.filterrow button{user-select:none;-webkit-user-select:none}
@media(display-mode:standalone){body{overscroll-behavior:none}}
/* thumb-zone navigation on phones */
.bnav{display:none}
.backbar{display:flex;align-items:center;gap:6px;margin-bottom:12px}
@media(max-width:640px){
  .backbar{position:sticky;top:0;z-index:40;background:var(--sand);padding:8px 0;margin:-4px 0 10px}
}
@media(max-width:640px){
  header nav{display:none}
  header{padding-bottom:12px}
  .bnav{
    display:flex;position:fixed;left:0;right:0;bottom:0;z-index:80;
    background:rgba(250,249,245,.94);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
    border-top:1px solid var(--line);
    padding:6px calc(6px + env(safe-area-inset-right)) calc(6px + env(safe-area-inset-bottom)) calc(6px + env(safe-area-inset-left));
  }
  .bnav button{
    flex:1;background:none;border:none;font-family:inherit;color:var(--muted);
    display:flex;flex-direction:column;align-items:center;gap:3px;
    padding:6px 2px;font-size:10.5px;font-weight:600;letter-spacing:.1px;cursor:pointer;border-radius:12px;
    min-height:52px;justify-content:center;
  }
  .bnav button .bi{font-size:19px;line-height:1}
  .bnav button.on{color:var(--teal);background:var(--teal-soft)}
  body{padding-bottom:calc(104px + env(safe-area-inset-bottom))}
  .fab{bottom:calc(88px + env(safe-area-inset-bottom));width:58px;height:58px;font-size:30px;box-shadow:0 4px 16px rgba(29,91,83,.42)}
  main{padding:12px calc(12px + env(safe-area-inset-right)) 12px calc(12px + env(safe-area-inset-left))}
  .modal{max-height:92vh;border-radius:22px 22px 0 0;padding-top:10px}
  .modal:before{content:'';display:block;width:38px;height:4px;border-radius:99px;background:var(--line);margin:0 auto 12px}
  .acts button{padding:8px 13px;font-size:12.5px;min-height:34px}
  .sqa button{padding:6px 11px;font-size:12px}
  .item{padding:13px 14px;border-radius:14px}
  .item:active{transform:scale(.985);background:#FCFBF8}
  .card{padding:13px}
  h2{font-size:17.5px;margin:18px 0 8px}
  .greet{font-size:22px}
  .btn{min-height:42px}
  .chips button,.filterrow button{min-height:36px}
  .pill{font-size:10.5px;padding:2px 8px}
  .toast{bottom:calc(112px + env(safe-area-inset-bottom));left:12px;right:12px;transform:none;text-align:center}
  .tl{padding-left:20px}
  .tl:before{left:5px}
  .tle .tdot{left:-20px;width:13px;height:13px}
  table{font-size:12.5px}
  .hrow{gap:8px}
  .logo{font-size:17px}
  .hdate{display:none}
  .spacesw button{padding:6px 12px;font-size:12.5px;min-height:34px}
  .topbar{gap:10px}
  .topbar .btn.sm{flex:1;justify-content:center}
  .grid.g4{gap:8px}
  .stat .v{font-size:23px}
  .stat .l{font-size:11.5px}
  .f input,.f select,.f textarea{padding:12px;border-radius:12px}
  .mbtns{position:sticky;bottom:0;background:var(--card);padding-top:10px;margin-top:14px}
  .cols{grid-template-columns:1fr}
  .empty{padding:14px;font-size:12.5px}
}
/* narrow or scaled-up screens (Android display-size, small phones) — tighten everything */
@media(max-width:412px){
  main{padding:10px calc(10px + env(safe-area-inset-right)) 10px calc(10px + env(safe-area-inset-left))}
  body{font-size:14px}
  h2{font-size:16px;margin:15px 0 7px}
  .greet{font-size:19px}
  .greetsub{font-size:12px}
  .item{padding:11px 12px;margin-bottom:8px}
  .item .t{font-size:13.5px}
  .item .m{font-size:12px}
  .card{padding:11px}
  .stat .v{font-size:20px}
  .stat .l{font-size:11px}
  .grid.g4{grid-template-columns:1fr 1fr;gap:7px}
  .acts{gap:5px}
  .acts button{padding:7px 10px;font-size:11.5px;min-height:32px}
  .btn{font-size:13.5px;padding:10px 13px;min-height:40px}
  .btn.sm{font-size:12px;padding:7px 10px}
  .logo{font-size:16px}
  .logo span[style]{display:none}
  .spacesw button{padding:5px 10px;font-size:12px}
  .bnav button{font-size:9.5px;min-height:48px}
  .bnav button .bi{font-size:17px}
  .pill{font-size:10px;padding:2px 7px}
  .hl{font-size:12.5px;padding:10px 12px}
  .chips button,.filterrow button{font-size:12px;padding:6px 11px}
  .modal h3{font-size:16px}
  .f label{font-size:11.5px}
  .subtle,.note{font-size:11.5px}
  .irow{flex-wrap:wrap}
  .acts{width:100%;justify-content:flex-end;margin-top:8px}
  .sqa{justify-content:flex-end;margin-top:6px}
  .grid.g4{grid-template-columns:1fr 1fr}
  .greet{font-size:21px}
  .cols{gap:10px}
  .colh{margin-top:4px}
  .filterrow{gap:5px}
  .btn{padding:10px 14px}
  nav button{padding:10px 11px;font-size:13.5px}
}
[draggable=true]{cursor:grab}
.item.sq{padding:8px 11px;margin-bottom:6px;border-radius:12px}
.sqt{font-size:13.5px;font-weight:500;line-height:1.35;cursor:pointer}
.sqt.clamp{display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.sqa{gap:4px}
.sqa button{padding:3px 8px;font-size:11px;border-radius:7px}
.sqhint{font-size:11px;color:var(--muted);cursor:pointer}
.fab{position:fixed;right:calc(18px + env(safe-area-inset-right));bottom:calc(24px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:99px;background:var(--teal);color:#fff;border:none;font-size:30px;font-weight:400;cursor:pointer;box-shadow:0 6px 20px rgba(15,118,110,.4);z-index:90;transition:transform .12s;line-height:1;font-family:inherit}
.fab:active{transform:scale(.92)}
.chips{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px}
.chips button{background:#F4EFE5;border:1.5px solid transparent;border-radius:99px;font-size:13px;font-weight:600;padding:7px 14px;cursor:pointer;font-family:inherit;color:var(--muted);transition:all .15s}
.chips button.on{background:var(--teal-soft);border-color:var(--teal);color:var(--teal-dark)}
/* charts */
.frow{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.frow .fl{width:110px;font-size:12.5px;color:var(--muted);text-align:right;flex-shrink:0}
.frow .fbwrap{flex:1;background:#F4EFE5;border-radius:8px;height:26px;overflow:hidden}
.frow .fb{height:100%;background:linear-gradient(90deg,var(--teal),var(--teal-mid));border-radius:8px;min-width:2px;transition:width .5s;display:flex;align-items:center;justify-content:flex-end;padding-right:7px;color:#fff;font-size:12px;font-weight:700}
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;margin-top:10px;font-size:12px;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:5px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
/* timeline */
.tl{position:relative;padding-left:24px}
.tl:before{content:'';position:absolute;left:7px;top:6px;bottom:6px;width:2px;background:var(--line)}
.tle{position:relative;margin-bottom:14px}
.tle .tdot{position:absolute;left:-24px;top:4px;width:16px;height:16px;border-radius:99px;border:3px solid var(--card);box-shadow:0 0 0 1.5px var(--line)}
.tle .tt{font-size:14px;font-weight:600;line-height:1.35}
.tle .tm{font-size:12px;color:var(--muted);margin-top:2px;line-height:1.45}
.tlmonth{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);margin:18px 0 12px;position:relative;left:-24px}
/* review */
.rwrap{max-width:640px;margin:0 auto}
.rprog{display:flex;gap:5px;margin-bottom:18px}
.rprog i{flex:1;height:5px;border-radius:99px;background:#E7E0D2}
.rprog i.on{background:var(--teal)}
.rhead{font-size:21px;font-weight:700;margin-bottom:4px}
.rsub{font-size:13.5px;color:var(--muted);margin-bottom:16px;line-height:1.5}
.bkwarn{background:var(--amber-soft);border:1px solid #F0D9B5;border-radius:var(--r);padding:10px 14px;font-size:13px;color:var(--amber);margin-bottom:12px}
.due{font-size:11.5px;font-weight:700}
.due.over{color:var(--red)}
.due.today{color:var(--amber)}
.due.later{color:var(--muted);font-weight:600}
a{color:var(--teal)}
.spacesw{display:flex;background:rgba(255,255,255,.12);border-radius:99px;padding:3px;gap:2px}
.spacesw button{background:none;border:none;color:#fff;opacity:.6;font-family:inherit;font-size:12px;font-weight:700;padding:5px 12px;border-radius:99px;cursor:pointer;white-space:nowrap;transition:all .15s}
.spacesw button.on{background:#fff;color:var(--teal-dark);opacity:1}
.goalbar{height:8px;background:#F4EFE5;border-radius:99px;overflow:hidden;margin:8px 0 4px}
.goalbar i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),var(--teal-mid));border-radius:99px}
.jdate{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);margin:16px 0 8px}
</style>
</head>
<body>
<header>
  <div class="hrow">
    <div class="logo">DeskLens <span>HQ</span> <span style="font-size:10px;font-weight:600;background:rgba(255,255,255,.15);padding:2px 7px;border-radius:99px;vertical-align:middle">v10.3</span></div>
    <div style="display:flex;align-items:center;gap:10px">
      <button onclick="openSearch()" title="Search everything (press /)" style="background:rgba(255,255,255,.14);border:none;color:#fff;width:34px;height:34px;border-radius:99px;font-size:15px;cursor:pointer;font-family:inherit">⌕</button>
      <div class="spacesw" id="spacesw"></div><span id="syncdot"></span><div class="hdate" id="hdate"></div>
    </div>
  </div>
  <nav id="nav"></nav>
</header>
<main id="main"></main>
<button class="fab" id="fab" title="Quick capture">+</button>
<nav class="bnav" id="bnav"></nav>
<div class="overlay" id="overlay"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>
<script>
'use strict';
/* ================= CORE ================= */
const LS_KEY='dlhq_v1';
const todayISO=()=>new Date().toISOString().slice(0,10);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const $=id=>document.getElementById(id);
const esc=s=>(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(msg){const t=$('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800);}
function fmtD(iso){if(!iso)return'';const d=new Date(iso+'T00:00');return d.toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'});}
function fmtDs(iso){if(!iso)return'';const d=new Date(iso+'T00:00');return d.toLocaleDateString('en-IN',{day:'numeric',month:'short'});}
const nowStamp=()=>new Date().toISOString();
function hhmm(ts){if(!ts)return '';const d=new Date(ts);return isNaN(d)?'':String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');}
function whenLabel(dateISO,time,ts){
  const t=time||hhmm(ts);
  return fmtD(dateISO)+(t?' · '+t:'');
}
function normDate(v){
  if(!v)return '';
  const s=String(v).trim();
  let m=s.match(/^(\d{4})-(\d{2})-(\d{2})/);                       // 2026-08-18 or ISO datetime
  if(m)return m[1]+'-'+m[2]+'-'+m[3];
  m=s.match(/^(\d{1,2})[\/-](\d{1,2})[\/-](\d{4})$/);              // 18/08/2026
  if(m)return m[3]+'-'+String(m[2]).padStart(2,'0')+'-'+String(m[1]).padStart(2,'0');
  const d=new Date(s);
  return isNaN(d)?'':d.toISOString().slice(0,10);
}
function daysAgo(iso){return Math.floor((new Date()-new Date(normDate(iso)+'T00:00'))/(864e5));}
function daysTo(iso){return Math.ceil((new Date(iso+'T00:00')-new Date())/(864e5));}
function lakh(n){return n>=1e7?(n/1e7).toFixed(2)+' Cr':(n/1e5).toFixed(2)+' L';}

function migrate(d){
  d.meta=d.meta||{created:todayISO()};d.meta.v=2;
  if(d.meta.lastReview===undefined)d.meta.lastReview=null;
  d.inbox=d.inbox||d.notes||[];delete d.notes;
  d.followups=d.followups||[];
  d.journey=d.journey||[];
  (d.sequence||[]).forEach(x=>{if(!x.created)x.created=todayISO();if(x.link===undefined)x.link='';});
  (d.clinics||[]).forEach(c=>{c.visits=c.visits||[];c.stageHistory=c.stageHistory||[{date:todayISO(),stage:c.stage}];});
  (d.questions||[]).forEach(q=>{if(!q.created)q.created=todayISO();});
  if(!d.journey.length){
    d.decisions.forEach(dd=>d.journey.push({id:uid(),date:dd.date,type:'decision',text:dd.title}));
    d.journey.push({id:uid(),date:todayISO(),type:'milestone',text:'DeskLens HQ \u2014 command center goes live'});
  }
  d.me=d.me||{sequence:[],inbox:[],followups:[],goals:[],journal:[],routines:[]};
  ['sequence','inbox','followups','goals','journal','routines'].forEach(k=>{d.me[k]=d.me[k]||[];});
  (d.me.sequence||[]).forEach(x=>{if(!x.created)x.created=todayISO();if(x.link===undefined)x.link='';});
  (d.people||[]).forEach(p=>{p.city=p.city||'';p.clinic=p.clinic||'';p.source=p.source||'';p.influence=p.influence||'';p.rel=p.rel||'';p.phone=p.phone||'';p.specialty=p.specialty||'';});
  (d.clinics||[]).forEach(c=>{if(c.brand===undefined)c.brand='';c.phone=c.phone||'';c.reviews=c.reviews||'';c.whoAnswers=c.whoAnswers||'';c.source=c.source||'';if(!Array.isArray(c.doctors))c.doctors=c.doctor?[c.doctor]:[];delete c.doctor;c.whoAnswersPhone=c.whoAnswersPhone||'';c.calls=c.calls||[];});
  (d.people||[]).forEach(p=>{p.calls=p.calls||[];});
  (d.followups||[]).forEach(f=>{if(!f.repeat)f.repeat='none';if(f.time===undefined)f.time='';});
  (d.me.followups||[]).forEach(f=>{if(!f.repeat)f.repeat='none';if(f.time===undefined)f.time='';});
  if(d.meta.aiKey===undefined)d.meta.aiKey='';
  if(d.meta.pilotMode===undefined)d.meta.pilotMode=true;
  if(d.meta.pilotNudged===undefined)d.meta.pilotNudged=false;
  if(d.meta.rev===undefined)d.meta.rev=0;
  if(!d.meta.hook)d.meta.hook={url:'',secret:'',on:false,lastAt:'',lastErr:''};
  if(!d.meta.custom)d.meta.custom={};
  return d;
}

const ROLES=['Doctor','Design Partner','Design Partner / Referral','Receptionist / staff','Association contact','Commission partner','Official (KPME/IMA/DHO)','Co-founder','Vendor','Friend / personal','Other'];
const INFLUENCES=['High — can open doors','Medium','Low / not relevant'];

function baseList(kind){
  return {specialty:SPECS,city:CITIES,source:SOURCES,brand:BRANDS.filter(b=>b),role:ROLES,stage:STAGES,influence:INFLUENCES,rel:RELS}[kind]||[];
}
function optList(kind){
  const custom=(S.meta.custom&&S.meta.custom[kind])||[];
  return [...new Set([...baseList(kind),...custom])];
}
function addCustom(kind,val){
  val=(val||'').trim();if(!val)return '';
  val=val.replace(/\b[a-z]/g,c=>c.toUpperCase()).replace(/\bOf\b|\bAnd\b|\bThe\b/g,m=>m.toLowerCase());
  if(!S.meta.custom)S.meta.custom={};
  const cur=S.meta.custom[kind]||[];
  if(!baseList(kind).some(x=>x.toLowerCase()===val.toLowerCase())&&!cur.some(x=>x.toLowerCase()===val.toLowerCase())){
    S.meta.custom[kind]=[...cur,val];save();toast('“'+val+'” added — it’ll be in this list from now on');
  }
  return val;
}

async function hookSend(silent){
  const h=S.meta.hook;
  if(!h||!h.on||!h.url)return;
  try{
    const r=await fetch(h.url,{method:'POST',headers:Object.assign({'Content-Type':'application/json'},h.secret?{'X-HQ-Secret':h.secret}:{}),body:JSON.stringify(hqExport())});
    if(!r.ok)throw new Error('HTTP '+r.status);
    S.meta.hook.lastAt=new Date().toISOString();S.meta.hook.lastErr='';
    localStorage.setItem(LS_KEY,JSON.stringify(S));
    if(!silent)toast('Sent to server ✓');
    if(tab==='data')render();
  }catch(e){
    S.meta.hook.lastErr=String(e.message||e);
    localStorage.setItem(LS_KEY,JSON.stringify(S));
    if(!silent)toast('Server push failed: '+S.meta.hook.lastErr);
  }
}
function hookPush(){
  const h=S.meta.hook;
  if(!h||!h.on||!h.url)return;
  clearTimeout(hookT);hookT=setTimeout(()=>hookSend(true),4000);
}

const CFG_KEY='dlhq_fbcfg';
let fb={app:null,db:null,auth:null,uid:null,ready:false,status:'off',unsub:null,pushT:null,applying:false};
function fbCfg(){try{return JSON.parse(localStorage.getItem(CFG_KEY)||'null');}catch(e){return null;}}
function syncBadge(){
  const map={off:['',''],connecting:['⋯ connecting','#F6EBDB'],live:['● live','#9FD8A8'],offline:['● offline','#F0C79A'],error:['● sync error','#F2B4AC']};
  const m=map[fb.status]||map.off;
  if(!m[0])return '<span id="syncdot"></span>';
  return '<span id="syncdot" style="font-size:11px;color:'+m[1]+';font-weight:600" title="Cloud sync">'+m[0]+'</span>';
}
function setSyncStatus(s){fb.status=s;const el=document.getElementById('syncdot');if(el)el.outerHTML=syncBadge();}
async function loadFirebase(){
  if(window.__fbLoaded)return;
  const a=await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js');
  const b=await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js');
  const c=await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js');
  window.__fb=Object.assign({},a,b,c);window.__fbLoaded=true;
}
async function initSync(silent){
  const cfg=fbCfg();if(!cfg)return;
  try{
    setSyncStatus('connecting');
    await loadFirebase();
    const F=window.__fb;
    fb.app=(F.getApps&&F.getApps().length)?F.getApps()[0]:F.initializeApp(cfg);
    fb.auth=F.getAuth(fb.app);
    fb.db=F.getFirestore(fb.app);
    try{await F.enableIndexedDbPersistence(fb.db);}catch(e){}
    F.onAuthStateChanged(fb.auth,u=>{
      if(u){fb.uid=u.uid;fb.ready=true;startListen();setTimeout(()=>makeSnapshot(),4000);}
      else{fb.uid=null;fb.ready=false;if(fb.unsub){fb.unsub();fb.unsub=null;}setSyncStatus('off');}
      if(tab==='data')render();
    });
  }catch(e){setSyncStatus('error');if(!silent)toast('Sync setup failed: '+e.message);}
}
function startListen(){
  const F=window.__fb;
  if(fb.unsub)fb.unsub();
  fb.unsub=F.onSnapshot(F.doc(fb.db,'hq',fb.uid),snap=>{
    setSyncStatus('live');
    if(!snap.exists()){cloudPush(true);return;}
    const data=snap.data();if(!data||!data.payload)return;
    let remote;try{remote=JSON.parse(data.payload);}catch(e){return;}
    const rrev=(remote.meta&&remote.meta.rev)||0,lrev=(S.meta&&S.meta.rev)||0;
    if(rrev>lrev){
      fb.applying=true;S=migrate(remote);
      localStorage.setItem(LS_KEY,JSON.stringify(S));
      fb.applying=false;render();toast('Updated from your other device');
    }else if(lrev>rrev)cloudPush(true);
  },err=>{setSyncStatus(err&&err.code==='unavailable'?'offline':'error');});
}
function cloudPush(now){
  if(!fb.ready||!fb.uid||fb.applying)return;
  clearTimeout(fb.pushT);
  const doIt=async()=>{
    try{
      const F=window.__fb;
      await F.setDoc(F.doc(fb.db,'hq',fb.uid),{payload:JSON.stringify(S),rev:S.meta.rev,at:new Date().toISOString()});
      setSyncStatus('live');
    }catch(e){setSyncStatus(e&&e.code==='unavailable'?'offline':'error');}
  };
  now?doIt():fb.pushT=setTimeout(doIt,900);
}
async function syncSaveCfg(){
  const raw=$('fbcfg').value.trim();
  if(!raw){localStorage.removeItem(CFG_KEY);toast('Config cleared');render();return;}
  // Tolerant parser: pull known keys out of whatever was pasted (whole snippet, imports and all)
  const cfg={};
  ['apiKey','authDomain','projectId','storageBucket','messagingSenderId','appId','measurementId','databaseURL'].forEach(k=>{
    const m=raw.match(new RegExp('["\']?'+k+'["\']?\\s*:\\s*["\']([^"\']+)["\']'));
    if(m)cfg[k]=m[1];
  });
  if(!cfg.apiKey||!cfg.projectId){
    alert('Could not find apiKey / projectId in that text.\n\nIn Firebase: Project settings → Your apps → your web app → copy the block that has apiKey, authDomain, projectId… and paste it here (extra lines are fine).');
    return;
  }
  if(!cfg.authDomain)cfg.authDomain=cfg.projectId+'.firebaseapp.com';
  localStorage.setItem(CFG_KEY,JSON.stringify(cfg));
  toast('Config saved — now sign in');
  await initSync();render();
}
async function syncAuth(mode){
  const cfg=fbCfg();if(!cfg){alert('Paste the Firebase config first.');return;}
  const email=$('fbmail').value.trim(),pass=$('fbpass').value;
  if(!email||!pass){alert('Enter email and password.');return;}
  try{
    await loadFirebase();const F=window.__fb;
    if(!fb.auth){fb.app=(F.getApps&&F.getApps().length)?F.getApps()[0]:F.initializeApp(cfg);fb.auth=F.getAuth(fb.app);fb.db=F.getFirestore(fb.app);}
    if(mode==='up')await F.createUserWithEmailAndPassword(fb.auth,email,pass);
    else await F.signInWithEmailAndPassword(fb.auth,email,pass);
    toast('Signed in ✓');
    await initSync();
  }catch(e){alert('Sign-in failed: '+(e.code||'')+'\n'+e.message);}
}

async function makeSnapshot(force){
  if(!fb.ready||!fb.uid)return;
  const today=todayISO();
  if(!force&&S.meta.lastSnap===today)return;
  try{
    const F=window.__fb;
    await F.setDoc(F.doc(fb.db,'hq',fb.uid,'snaps',today),{payload:JSON.stringify(S),at:new Date().toISOString(),ver:APP_VERSION});
    S.meta.lastSnap=today;localStorage.setItem(LS_KEY,JSON.stringify(S));
    // prune: keep newest 14
    const q=await F.getDocs(F.collection(fb.db,'hq',fb.uid,'snaps'));
    const ids=q.docs.map(d=>d.id).sort();
    if(ids.length>14){
      const old=ids.slice(0,ids.length-14);
      await Promise.all(old.map(id=>F.deleteDoc(F.doc(fb.db,'hq',fb.uid,'snaps',id))));
    }
    if(force)toast('Snapshot saved ✓');
  }catch(e){if(force)toast('Snapshot failed: '+(e.code||e.message));}
}
async function loadSnaps(){
  if(!fb.ready||!fb.uid){toast('Sign in to cloud sync first');return;}
  try{
    const F=window.__fb;
    const q=await F.getDocs(F.collection(fb.db,'hq',fb.uid,'snaps'));
    snapList=q.docs.map(d=>({id:d.id,at:d.data().at,ver:d.data().ver,payload:d.data().payload})).sort((a,b)=>b.id.localeCompare(a.id));
    render();
    if(!snapList.length)toast('No snapshots yet — one is created each day');
  }catch(e){toast('Could not load snapshots: '+(e.code||e.message));}
}
function restoreSnap(id){
  const s=snapList&&snapList.find(x=>x.id===id);if(!s)return;
  if(!confirm('Restore your data as it was on '+fmtD(id)+'?\n\nThis replaces current data on ALL your devices. A safety snapshot of right now is taken first.'))return;
  makeSnapshot(true).then(()=>{
    try{
      const d=JSON.parse(s.payload);
      S=migrate(d);S.meta.rev=Date.now();
      localStorage.setItem(LS_KEY,JSON.stringify(S));
      cloudPush(true);
      snapList=null;render();toast('Restored to '+fmtD(id)+' ✓');
    }catch(e){alert('Restore failed: '+e.message);}
  });
}
async function syncOut(){
  try{await window.__fb.signOut(fb.auth);toast('Signed out — local only now');render();}catch(e){toast('Sign out failed');}
}

/* ================= DOCTOR ↔ CLINIC SYNC ================= */
function nameEq(a,b){return !!a&&!!b&&a.trim().toLowerCase().replace(/^dr\.?\s*/,'')===b.trim().toLowerCase().replace(/^dr\.?\s*/,'');}
function linkClinicDoctor(c){
  const created=[];
  (c.doctors||[]).forEach(dname=>{
    if(!dname)return;
    let p=S.people.find(x=>nameEq(x.name,dname));
    if(!p){
      p={id:uid(),name:dname,role:'Doctor',org:'',specialty:c.specialty||'',phone:'',city:c.city||'',clinic:c.name,source:c.source||'',influence:'',rel:'New',notes:'Auto-created from clinic '+c.name};
      S.people.push(p);created.push(p.name);
    }else{
      // person exists — fill blanks on BOTH sides
      if(!p.clinic)p.clinic=c.name;
      if(!p.specialty&&c.specialty&&c.specialty!=='Other')p.specialty=c.specialty;
      if(!p.city&&c.city)p.city=c.city;
      if((!c.specialty||c.specialty==='Other')&&p.specialty)c.specialty=p.specialty;
      if(!c.city&&p.city)c.city=p.city;
      if(!c.source&&p.source)c.source=p.source;
    }
  });
  return created.length?created.join(', '):null;
}
function linkClinicStaff(c){
  if(!c.whoAnswers)return;
  let p=S.people.find(x=>nameEq(x.name,c.whoAnswers));
  if(!p){
    p={id:uid(),name:c.whoAnswers,role:'Receptionist / staff',org:'',specialty:'',phone:c.whoAnswersPhone||'',city:c.city||'',clinic:c.name,source:'',influence:'',rel:'New',notes:'Answers the phone at '+c.name};
    S.people.push(p);
  }else{
    if(!p.clinic)p.clinic=c.name;
    if(!p.phone&&c.whoAnswersPhone)p.phone=c.whoAnswersPhone;
  }
}
function linkPersonClinic(p){
  if(!p.clinic){
    const c=S.clinics.find(x=>(x.doctors||[]).some(d=>nameEq(d,p.name)));
    if(c)p.clinic=c.name;
  }
  if(p.clinic){
    const c=S.clinics.find(x=>x.name===p.clinic);
    if(c){
      if(/doctor|design partner/i.test(p.role||'')&&!(c.doctors||[]).some(d=>nameEq(d,p.name)))c.doctors.push(p.name);
      // fill blanks in both directions
      if((!c.specialty||c.specialty==='Other')&&p.specialty)c.specialty=p.specialty;
      if(!c.city&&p.city)c.city=p.city;
      if(!c.source&&p.source)c.source=p.source;
      if(!p.city&&c.city)p.city=c.city;
      if(!p.specialty&&c.specialty&&c.specialty!=='Other')p.specialty=c.specialty;
      if(!p.source&&c.source)p.source=c.source;
    }
  }
}
function renameClinicRefs(oldName,newName){
  if(oldName===newName)return;
  S.people.forEach(p=>{if(p.clinic===oldName)p.clinic=newName;});
  [...S.sequence,...S.me.sequence].forEach(t=>{if(t.link===oldName)t.link=newName;});

/* ================= GUIDED WIZARD ================= */
let wiz=null;
function startWizard(fields,initial,onSave){
  wiz={fields,vals:Object.assign({},initial),step:0,onSave};
  renderWizard();
}
function renderWizard(){
  const f=wiz.fields[wiz.step];
  let inputHtml='';
  if(f.type==='select'){
    const list=f.kind?optList(f.kind):f.options;
    inputHtml='<div class="chips" style="margin-top:8px;max-height:40vh;overflow-y:auto">'
      +list.filter(o=>o!==''&&o!=='— none —').map(o=>'<button class="'+(wiz.vals[f.key]===o?'on':'')+'" onclick="wizPick(this.textContent)">'+esc(o)+'</button>').join('')
      +(f.kind?'<button style="border-style:dashed;border-color:var(--teal);color:var(--teal)" onclick="wizNewOpt(\''+f.kind+'\')">＋ Add new…</button>':'')
      +'</div>';
  }else if(f.type==='multicombo'){
    const sel=wiz.vals[f.key]||[];
    const allOpts=[...new Set([...(f.options||[]),...sel])];
    inputHtml=(allOpts.length?'<div class="note" style="margin:2px 0 4px">Tap all that apply…</div><div class="chips" style="max-height:30vh;overflow-y:auto">'+allOpts.map(o=>'<button class="'+(sel.includes(o)?'on':'')+'" onclick="wizToggle(this.textContent)">'+esc(o)+'</button>').join('')+'</div>':'')
      +'<div class="note" style="margin:6px 0 0">…and/or dictate a new name, then tap Add:</div>'
      +'<div style="display:flex;gap:8px;margin-top:6px"><input type="text" id="wiz_in" placeholder="New name…" style="flex:1;font-family:inherit;font-size:15px;padding:11px;border:1.5px solid var(--line);border-radius:11px;background:#FDFCF9" onkeydown="if(event.key===\'Enter\'){event.preventDefault();wizAddName();}"><button class="btn sm" onclick="wizAddName()">Add</button></div>'
      +(sel.length?'<div class="note" style="margin-top:8px">Selected: <b>'+sel.map(esc).join(', ')+'</b></div>':'');
  }else if(f.type==='combo'){
    inputHtml=(f.options&&f.options.length?'<div class="note" style="margin:2px 0 4px">Tap someone you already know…</div><div class="chips" style="max-height:30vh;overflow-y:auto">'+f.options.map(o=>'<button class="'+(wiz.vals[f.key]===o?'on':'')+'" onclick="wizPick(this.textContent)">'+esc(o)+'</button>').join('')+'</div><div class="note" style="margin:6px 0 0">…or dictate a new name:</div>':'')
      +'<div class="f" style="margin-top:6px"><input type="text" id="wiz_in" placeholder="New name…" value="'+(f.options&&f.options.includes(wiz.vals[f.key])?'':esc(wiz.vals[f.key]||''))+'" onkeydown="if(event.key===\'Enter\')wizNext()"></div>';
  }else if(f.type==='textarea'){
    inputHtml='<div class="f" style="margin-top:8px"><textarea id="wiz_in" placeholder="Dictate or type…">'+esc(wiz.vals[f.key]||'')+'</textarea></div>';
  }else{
    inputHtml='<div class="f" style="margin-top:8px"><input type="'+(f.type||'text')+'" id="wiz_in" placeholder="Dictate or type…" value="'+esc(wiz.vals[f.key]||'')+'" onkeydown="if(event.key===\'Enter\')wizNext()"></div>';
  }
  $('modal').innerHTML='<div class="rprog" style="margin-bottom:16px">'+wiz.fields.map((x,i)=>'<i class="'+(i<=wiz.step?'on':'')+'"></i>').join('')+'</div>'
    +'<h3 style="font-size:21px">'+esc(f.label)+'</h3>'
    +(f.hint?'<div class="note" style="margin:2px 0 6px">'+f.hint+'</div>':'')
    +inputHtml
    +'<div class="mbtns">'
    +(wiz.step>0?'<button class="btn sec" onclick="wizBack()">←</button>':'<button class="btn sec" onclick="closeModal();wiz=null">Cancel</button>')
    +(f.required?'':'<button class="btn sec" onclick="wizSkip()">Skip</button>')
    +'<button class="btn" onclick="wizNext()">'+(wiz.step===wiz.fields.length-1?'Save ✓':'Next →')+'</button>'
    +'</div>';
  $('overlay').classList.add('open');
  const inp=$('wiz_in');if(inp)inp.focus();
}
function wizRead(){
  const inp=$('wiz_in');if(!inp)return;
  const f=wiz.fields[wiz.step];
  if(f.type==='multicombo'){if(inp.value.trim())wizAddName();return;}
  if(f.type==='combo'&&!inp.value.trim())return; // keep chip pick if input left empty
  wiz.vals[f.key]=inp.value.trim();
}
function wizNewOpt(kind){
  const v=prompt('Add a new '+kind.replace('rel','relationship')+':');
  if(!v||!v.trim())return;
  const val=addCustom(kind,v);
  wiz.vals[wiz.fields[wiz.step].key]=val;
  wizNext(true);
}
function wizToggle(v){
  const f=wiz.fields[wiz.step];
  const a=wiz.vals[f.key]||[];
  wiz.vals[f.key]=a.includes(v)?a.filter(x=>x!==v):[...a,v];
  renderWizard();
}
function wizAddName(){
  const inp=$('wiz_in');if(!inp||!inp.value.trim())return;
  const f=wiz.fields[wiz.step];
  const a=wiz.vals[f.key]||[];
  if(!a.some(x=>nameEq(x,inp.value)))wiz.vals[f.key]=[...a,inp.value.trim()];
  renderWizard();
}
function wizPick(v){wiz.vals[wiz.fields[wiz.step].key]=v;wizNext(true);}
function wizNext(fromPick){
  if(!fromPick)wizRead();
  const f=wiz.fields[wiz.step];
  if(f.required&&!wiz.vals[f.key]){toast('This one is needed');return;}
  if(f.after)try{f.after(wiz.vals[f.key],wiz.vals);}catch(e){}
  if(wiz.step===wiz.fields.length-1){const v=wiz.vals;const cb=wiz.onSave;wiz=null;closeModal();cb(v);return;}
  wiz.step++;renderWizard();
}
function wizBack(){wizRead();wiz.step--;renderWizard();}
function wizSkip(){wiz.step===wiz.fields.length-1?wizNext(true):(wiz.step++,renderWizard());}

function positionalFill(txt){
  const d=FORM_DEFS[form.kind];
  const parts=txt.split(/[,;\n]/).map(x=>x.trim());
  const skip=v=>!v||/^(skip|none|na|n\/a|-|nil|no)$/i.test(v);
  parts.forEach((val,i)=>{
    const f=d.fields[i];
    if(!f||skip(val))return;
    if(f.t==='chips'||f.t==='people'){
      const list=f.kind?optList(f.kind):(f.opts?f.opts():[]);
      const lo=val.toLowerCase();
      const m=list.find(o=>o.toLowerCase()===lo)                          // exact
        ||list.find(o=>o.toLowerCase().startsWith(lo))                    // "high" → "High — can open doors"
        ||list.find(o=>o.split(/[—/(]/)[0].trim().toLowerCase()===lo)     // "diagnostics" → "Diagnostics / Pathology"
        ||list.find(o=>lo.startsWith(o.toLowerCase()))                    // "samsung galaxy" → "Samsung"
        ||bestMatch(val,list);
      if(m)form.vals[f.k]=m;
      else if(f.kind)form.vals[f.k]=addCustom(f.kind,val);                // new option, remembered
      else form.vals[f.k]=val;                                            // e.g. a new doctor name
    }else if(f.t==='number'){
      const n=val.replace(/[^\d]/g,'');if(n)form.vals[f.k]=n;
    }else if(f.t==='tel'){
      const n=val.replace(/[^\d]/g,'');if(n.length>=6)form.vals[f.k]=n;
    }else{
      form.vals[f.k]=val.charAt(0).toUpperCase()+val.slice(1);
    }
  });
}
async function toggleRec(){
  if(rec.mr&&rec.mr.state==='recording'){stopRec();return;}
  if(!navigator.mediaDevices||!window.MediaRecorder){alert('Recording isn’t available in this browser — use the text box below and your keyboard mic.');return;}
  try{
    const stream=await navigator.mediaDevices.getUserMedia({audio:true});
    const mime=['audio/webm','audio/mp4','audio/ogg'].find(m=>window.MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported(m))||'';
    rec.mr=mime?new MediaRecorder(stream,{mimeType:mime}):new MediaRecorder(stream);
    rec.mime=rec.mr.mimeType||mime||'audio/webm';
    rec.chunks=[];rec.blob=null;
    rec.mr.ondataavailable=e=>{if(e.data.size)rec.chunks.push(e.data);};
    rec.mr.onstop=()=>{
      rec.blob=new Blob(rec.chunks,{type:rec.mime});
      stream.getTracks().forEach(t=>t.stop());
      const b=$('recbtn'),t=$('rectime');
      if(b){b.textContent='✓';b.style.background='var(--green)';}
      if(t)t.textContent='Recorded '+fmtSecs((Date.now()-rec.t0)/1000)+' — reading it now…';
      formVoiceRun();
    };
    rec.mr.start();rec.t0=Date.now();
    const b=$('recbtn');if(b){b.textContent='⏹';b.style.background='var(--red)';}
    const t0el=$('rectime');if(t0el)t0el.innerHTML='Speak now… <div style="font-size:20px;color:var(--teal)">▁</div><span style="font-size:11px">stops on its own when you finish · or tap to stop</span>';
    // listen to the level so we can stop by ourselves when he stops talking
    let spoke=false,lastLoud=Date.now(),level=0;
    try{
      const AC=window.AudioContext||window.webkitAudioContext;
      if(AC){
        rec.ac=new AC();
        const src=rec.ac.createMediaStreamSource(stream),an=rec.ac.createAnalyser();
        an.fftSize=512;src.connect(an);
        const buf=new Uint8Array(an.fftSize);
        rec.levelTimer=setInterval(()=>{
          an.getByteTimeDomainData(buf);
          let sum=0;for(let i=0;i<buf.length;i++)sum+=Math.abs(buf[i]-128);
          level=sum/buf.length;
          if(level>5){spoke=true;lastLoud=Date.now();}
        },100);
      }
    }catch(e){}
    clearInterval(rec.timer);
    rec.timer=setInterval(()=>{
      const t=$('rectime'),el=Date.now()-rec.t0;
      const bars='▁▂▃▄▅▆▇'.slice(0,Math.max(1,Math.min(7,Math.round(level/3))));
      if(t)t.innerHTML=(spoke?'Listening ':'Speak now… ')+fmtSecs(el/1000)
        +'<div style="font-size:20px;color:var(--teal);letter-spacing:2px">'+bars+'</div>'
        +'<span style="font-size:11px">stops on its own when you finish · or tap to stop</span>';
      if(spoke&&Date.now()-lastLoud>2500)stopRec();      // he finished talking
      if(!spoke&&el>12000)stopRec();                      // nothing said
      if(el>120000)stopRec();                             // hard cap
    },200);
  }catch(e){alert('Microphone blocked. Allow mic access for this site, or use the text box below.');}
}

function bestMatch(text,list){
  const lo=' '+text.toLowerCase().replace(/[^a-z0-9 /]/g,' ')+' ';
  let best='';
  list.forEach(o=>{
    o.split('/').map(x=>x.trim()).forEach(alias=>{
      const a=alias.toLowerCase().replace(/[^a-z0-9 ]/g,' ').trim();
      if(a.length<3)return;
      if(new RegExp('(^| )'+a.replace(/\s+/g,'\\s+')+'( |$)').test(lo)&&a.length>best.length)best=o;
    });
  });
  return best;
}
function ruleFill(txt){
  const v=form.vals,parts=txt.split(/[,\n]/).map(x=>x.trim()).filter(Boolean);
  if(!v.name&&parts[0])v.name=parts[0];
  const whole=txt;
  const sp=bestMatch(whole,optList('specialty'));if(sp)v.specialty=sp;
  const ct=bestMatch(whole,optList('city'));if(ct)v.city=ct;
  const br=bestMatch(whole,optList('brand'));if(br)v.brand=br;
  if(form.kind==='person'){const rl=bestMatch(whole,optList('role'));if(rl)v.role=rl;}
  parts.forEach(p=>{
    const rev=p.match(/(\d{2,5})\s*(reviews?|ratings?)/i);if(rev)v.reviews=rev[1];
    const ph=p.match(/\b([6-9]\d{9})\b/);
    if(ph){if(/recept/i.test(p)&&form.kind==='clinic')v.whoAnswersPhone=ph[1];else if(form.kind==='clinic'&&!v.phone)v.phone=ph[1];else if(!v.phone)v.phone=ph[1];}
    const dr=p.match(/\bDr\.?\s+[A-Z][\w.]*(\s+[A-Z][\w.]*)?/);
    if(dr&&form.kind==='clinic'&&!v.doctor)v.doctor=dr[0];
    const rc=p.match(/recept(?:ionist)?\s+([A-Z][a-z]+)/i);if(rc&&form.kind==='clinic')v.whoAnswers=rc[1];
  });
}

const WEEKDAYS=['sunday','monday','tuesday','wednesday','thursday','friday','saturday'];
function parseDue(lo){
  if(/\btoday\b|\btonight\b/.test(lo))return 0;
  if(/day after/.test(lo))return 2;
  if(/\btomorrow\b/.test(lo))return 1;
  if(/next week/.test(lo))return 7;
  for(let i=0;i<7;i++){if(lo.includes(WEEKDAYS[i])){const d=(i-new Date().getDay()+7)%7;return d===0?7:d;}}
  return null;
}
async function aiClassify(txt){

    contents:[{parts:[{text:'You sort an Indian founder\'s voice dump into structured items. Today is '+todayISO()+' (India). Known clinics: '+S.clinics.map(c=>c.name).join('; ')+'. Known people: '+S.people.map(p=>p.name).join('; ')+'. Split the text into separate items. CLEANING RULE for "text": extract the fact, discard the phrasing — drop fillers ("remind me to", "I should", "I need to"), drop date/time words once captured in due/time, use concise imperative form, capitalize. Example: "Remind me to call Karthik tomorrow at 4 pm about repo access" → text "Call Karthik about repo access", due=tomorrow, time="16:00". Journal entries are the exception: keep them verbatim. For each return JSON: {"text": cleaned item per the rule, "type": "note"|"task"|"fu"|"journal"|"clinic"|"person"|"visit", "who": person name if fu else "", "due": "YYYY-MM-DD" if a day is implied else "", "time": "HH:MM" 24h if mentioned else "", "link": the EXACT known clinic/person name this item concerns else "", "name": for new clinic/person the proper name, "city": if mentioned, "doctor": doctor name for a new clinic if mentioned, "specialty": medical specialty if mentioned, "notes": for a new clinic/person, descriptive info worth remembering, cleaned (e.g. "He is a very reputed person") — NEVER the command phrasing}. Types: "fu"=follow-up/reminder with person or date; "task"=something to do; "journal"=personal reflection; "clinic"=a NEW clinic to add (not in known list); "person"=a NEW person met/to add (not in known list); "visit"=the founder physically visited a KNOWN clinic (set link; set due=visit date, time if said; text must contain ONLY what happened/was observed — never repeat the "I visited X at Y" phrasing; if nothing beyond the visit itself was said, text="Visit logged"); else "note". If an item concerns a doctor or person NOT in the known lists, still put their full name (with Dr. prefix if doctor) in "link" (for task/note) or "who" (for fu). Return ONLY a JSON array.\n\nTEXT:\n'+txt}]}],
    generationConfig:{temperature:0,responseMimeType:'application/json'}
  };
  const arr=await gemini(body.contents[0].parts,{prefer:'gemini-2.5-flash'});
  return arr.map(x=>({text:(x.text||'').trim(),type:['note','task','fu','journal','clinic','person','visit'].includes(x.type)?x.type:'note',who:x.who||'',due:x.due||'',time:x.time||'',link:x.link||'',name:x.name||'',city:x.city||'',doctor:x.doctor||'',specialty:x.specialty||'',noteTxt:x.notes||''})).filter(x=>x.text);
}
function parseTimeStr(lo){
  const tm=lo.match(/\bat\s+(\d{1,2})(?:[:.](\d{2}))?\s*(a\.?m|p\.?m)?/);
  if(!tm)return'';
  let hh=parseInt(tm[1]);const min=tm[2]||'00';const ap=tm[3]||'';
  if(/p/.test(ap)&&hh<12)hh+=12;if(/a/.test(ap)&&hh===12)hh=0;
  return String(hh).padStart(2,'0')+':'+min;
}
function cleanEntry(t,stripWhen){
  let s=t.trim();
  s=s.replace(/^(please\s+)?(remind me to\s+|remind me\s+|i (should|need to|have to|must|want to|will)\s+|i am going to\s+|i'm going to\s+|task[:,]\s*|todo[:,]\s*|note[:,]\s*)/i,'');
  if(stripWhen){
    s=s.replace(/\b(day after tomorrow|tomorrow|today|tonight|next week)\b/gi,'');
    s=s.replace(/\b(on\s+)?(sunday|monday|tuesday|wednesday|thursday|friday|saturday)\b/gi,'');
    s=s.replace(/\bat\s+\d{1,2}([:.]\d{2})?\s*(a\.?m\.?|p\.?m\.?|o'?clock)?/gi,'');
  }
  s=s.replace(/\s{2,}/g,' ').replace(/\s+([,.])/g,'$1').replace(/^[,\s]+|[,\s.]+$/g,'');
  if(s)s=s[0].toUpperCase()+s.slice(1);
  return s;
}
function extractNote(after){
  let s=(after||'').replace(/^["”]?\s*(?:,|\.)?\s*(?:and\s+)?/i,'').trim();
  s=s.replace(/^(?:in (?:its|his|her|the) notes?,?\s*(?:add|mention|write|say|put)(?:\s+that)?|add (?:a )?note(?:\s+that)?|notes?[:,]|note that)\s*/i,'');
  s=s.replace(/^that\s+/i,'').replace(/^[,\s]+|[\s]+$/g,'');
  if(s)s=s[0].toUpperCase()+s.slice(1);
  return s;
}
function classifyPart(p){
  const lo=p.toLowerCase();
  const item={text:p,type:'note',who:'',due:'',time:'',link:'',name:'',city:'',doctor:'',specialty:''};
  const fuMatch=/\b(remind me|follow ?up|call|ask|ping|check with|message|whatsapp|meet)\b/.test(lo);
  const taskMatch=/^(task|todo)\b|\b(need to|have to|must|should|build|draft|prepare|finish|send|collect|get)\b/.test(lo);
  const jMatch=/\b(feel|felt|today was|grateful|learned|proud|tired|reflection)\b/.test(lo);
  const dueDays=parseDue(lo);
  // new clinic / new person / visit — spoken commands (natural phrasing)
  if(/\b(?:new|add(?:\s+(?:a|the))?|create(?:\s+(?:a|the))?)\s+(?:clinic|hospital|diagnostic\s*cent(?:er|re)|lab)\b/i.test(p)){
    item.type='clinic';
    let m=p.match(/(?:by\s+(?:the\s+)?name(?:\s+of)?|named|called)[,:\s]+["“]?([^,"”]+)/i);
    if(!m)m=p.match(/\b(?:clinic|hospital|cent(?:er|re)|lab)\b[,:\s]+["“]?([^,"”]+)/i);
    if(m){
      let nm=m[1].trim().replace(/\.$/,''),city='';
      const cm=nm.match(/^(.*)\s+(?:in|at)\s+([A-Z][A-Za-z]+)$/);
      if(cm){nm=cm[1].trim();city=cm[2];}
      item.name=nm;item.city=city;
      item.noteTxt=extractNote(p.slice(m.index+m[0].length));
    }
    return item;
  }
  if(/\b(?:met (?:a )?(?:dr|doctor)|new (?:person|contact|doctor)|add (?:a |the )?(?:person|contact|doctor))\b/i.test(p)){
    item.type='person';
    let m=p.match(/(?:by\s+(?:the\s+)?name(?:\s+of)?|named|called)[,:\s]+["“]?([^,"”]+)/i);
    if(!m)m=p.match(/\b(?:[Mm]et (?:a )?|[Nn]ew person[,:\s]+|[Aa]dd (?:a |the )?person[,:\s]+|[Nn]ew contact[,:\s]+|[Aa]dd (?:a |the )?(?:doctor|contact)[,:\s]+)((?:Dr\.?\s+)?[A-Z][\w.]*(?:\s+[A-Z][\w.]*)*)/);
    if(m){item.name=m[1].trim().replace(/\.$/,'');item.noteTxt=extractNote(p.slice(m.index+m[0].length));}
    return item;
  }
  if(/\b(visited|went to)\b/.test(lo)){
    const cl=autoLink(p);
    if(cl&&S.clinics.some(c=>c.name===cl)){
      item.type='visit';item.link=cl;
      if(/\byesterday\b/.test(lo)){const d=new Date();d.setDate(d.getDate()-1);item.due=d.toISOString().slice(0,10);}
      else item.due=todayISO();
      const tm=lo.match(/\bat\s+(\d{1,2})(?:[:.](\d{2}))?\s*(a\.?m|p\.?m)?/);
      if(tm){let hh=parseInt(tm[1]);const min=tm[2]||'00';const ap=tm[3]||'';if(/p/.test(ap)&&hh<12)hh+=12;if(/a/.test(ap)&&hh===12)hh=0;item.time=String(hh).padStart(2,'0')+':'+min;}
      // note = only what happened, not the "I visited X today at Y" phrasing
      const rem=(p.split(/[,.](.+)/)[1]||'').trim();
      item.text=rem||'Visit logged';
      return item;
    }
  }
  item.link=autoLink(p);
  if(!item.link){
    const dm=p.match(/\bDr\.?\s+([A-Z][a-z]+(?:\s+[A-Z][a-z]+)?)/);
    if(dm)item.link='Dr. '+dm[1];
  }
  if(fuMatch){
    item.type='fu';
    const m=p.match(/\b(?:[Cc]all|[Aa]sk|[Pp]ing|[Cc]heck with|[Mm]essage|[Ww]hatsapp|[Mm]eet|[Rr]emind)\s+(?:me\s+to\s+\w+\s+)?((?:Dr\.?\s+)?[A-Z][\w.]*(?:\s+[A-Z][\w.]*)?)/);
    if(m)item.who=m[1];
    const d=new Date();d.setDate(d.getDate()+(dueDays===null?1:dueDays));
    item.due=d.toISOString().slice(0,10);
    item.time=parseTimeStr(lo);
    item.text=cleanEntry(p,true)||p;
  }else if(taskMatch){item.type='task';item.text=cleanEntry(p,false)||p;}
  else if(jMatch&&space==='me'){item.type='journal';}
  return item;
}

/* ================= DERIVED ================= */
function payingCount(){return S.clinics.filter(c=>['Paying','Renewed'].includes(c.stage)).length;}
function liveCount(){return S.clinics.filter(c=>['Pilot','Paying','Renewed'].includes(c.stage)).length;}
function lastVisit(c){return c.visits.length?c.visits.map(v=>v.date).sort().slice(-1)[0]:null;}
function openFU(){return box().followups.filter(f=>!f.done).sort((a,b)=>(a.due||'9999').localeCompare(b.due||'9999'));}
function duePill(due){
  if(!due)return '<span class="due later">no date</span>';
  const d=daysTo(due);
  if(d<0)return '<span class="due over">overdue '+(-d)+'d</span>';
  if(d===0)return '<span class="due today">today</span>';
  return '<span class="due later">'+fmtDs(due)+' \u00b7 in '+d+'d</span>';
}

/* ================= HIGHLIGHTS ================= */
function highlights(){
  const H=[];
  const od=openFU().filter(f=>f.due&&daysTo(f.due)<0);
  if(od.length)H.push(['bad',od.length+' follow-up'+(od.length>1?'s':'')+' overdue \u2014 oldest: \u201c'+od[0].text+'\u201d ('+esc(od[0].who||'')+')']);
  const dueToday=openFU().filter(f=>f.due&&daysTo(f.due)===0);
  if(dueToday.length)H.push(['warn',dueToday.length+' follow-up'+(dueToday.length>1?'s':'')+' due today']);
  const hs=S.clinics.filter(c=>['Pilot','Paying','Renewed','Design Partner'].includes(c.stage)&&c.handset!=='ok');
  if(hs.length)H.push(['warn','Handset recording unverified at '+hs.length+' active clinic'+(hs.length>1?'s':'')+' \u2014 hard gate before any demo']);
  const nb=S.clinics.filter(c=>ACTIVE_STAGES.includes(c.stage)&&!c.brand);
  if(nb.length)H.push(['warn','Handset brand unknown at '+nb.length+' active clinic'+(nb.length>1?'s':'')+' \u2014 brand decides whether recording is even possible']);
  const badb=S.clinics.filter(c=>ACTIVE_STAGES.includes(c.stage)&&BAD_BRANDS.includes(c.brand));
  if(badb.length)H.push(['bad',badb.map(c=>c.name.split(' \u2014')[0]).join(', ')+': handset brand can\u2019t do OS-level recording \u2014 needs a supported phone before DeskLens can work']);
  const partb=S.clinics.filter(c=>ACTIVE_STAGES.includes(c.stage)&&PARTIAL_BRANDS.includes(c.brand));
  if(partb.length)H.push(['warn',partb.map(c=>c.name.split(' \u2014')[0]).join(', ')+': Motorola/Pixel records ONLY unknown-number incoming calls (needs \u201cRecord Unknown Numbers\u201d ON) \u2014 outgoing & saved contacts are missed. Data will be partial.']);
  const stale=S.clinics.filter(c=>['Design Partner','Pilot','Audit (7-day)'].includes(c.stage)).filter(c=>{const lv=lastVisit(c);return !lv||daysAgo(lv)>=10;});
  if(stale.length)H.push(['warn',stale.length+' active clinic'+(stale.length>1?'s':'')+' with no visit logged in 10+ days ('+stale.map(c=>c.name.split(' \u2014')[0]).slice(0,3).join(', ')+')']);
  if(liveCount()>=15)H.push(['good','Clinic 15 gate PASSED \u2014 partner activation unlocked. Attribution tracker must exist before the first partner.']);
  else if(liveCount()>=3)H.push(['good','Gate 1 (3 clinics) passed \u2014 '+liveCount()+' live. Next gate: 8.']);
  if(box().inbox.length>=5)H.push(['info',box().inbox.length+' unsorted notes in Inbox \u2014 worth a 2-minute sort']);
  const oldQ=S.questions.filter(q=>q.status==='open'&&daysAgo(q.created)>=14);
  if(oldQ.length)H.push(['info',oldQ.length+' open question'+(oldQ.length>1?'s':'')+' with Karthik unanswered for 14+ days']);
  const bkAge=S.meta.lastBackup?daysAgo(S.meta.lastBackup):null;
  if(bkAge===null)H.push(['warn','No backup taken yet \u2014 Data tab \u2192 Backup. Your data lives only in this browser.']);
  else if(bkAge>7)H.push(['warn','Last backup '+bkAge+' days ago \u2014 take one (Data tab)']);
  const dow=new Date().getDay();
  if((dow===0||dow===6)&&S.meta.lastReview!==todayISO()&&daysAgo(S.meta.lastReview||'2000-01-01')>3)H.push(['info','Weekend \u2014 good moment for your Weekly Review (button below)']);
  return H;
}

function greeting(){

    :'Your world, in order.';
  return '<div class="greet">'+g+'</div><div class="greetsub">'+sub+'</div>';
}
function celebrate(){

let seqX=new Set();
function toggleSeqX(id){seqX.has(id)?seqX.delete(id):seqX.add(id);render();}
function seqItem(x){
  const moves=[['now','N'],['queued','Q'],['parked','P']].filter(m=>m[0]!==x.bucket);
  const open=seqX.has(x.id);
  const hasMore=!!(x.trigger||x.notes);
  return '<div class="item sq" draggable="true" data-drag="'+x.id+'"><div class="irow"><div style="min-width:0;flex:1">'
    +'<div class="sqt'+(open?'':' clamp')+'" data-x="'+x.id+'">'+esc(x.title)+(x.link?' <span class="pill teal" style="background:var(--teal-soft);color:var(--teal-dark);margin-left:4px;font-size:10px" data-n="'+esc(x.link)+'">'+esc(x.link)+' ›</span>':'')+'</div>'
    +(open&&x.trigger?'<div class="m"><span class="pill grey">trigger</span> '+esc(x.trigger)+'</div>':'')
    +(open&&x.notes?'<div class="m">'+esc(x.notes)+'</div>':'')
    +(hasMore&&!open?'<span class="sqhint" data-x="'+x.id+'">more ▾</span>':'')
    +(open?'<span class="sqhint" data-x="'+x.id+'">less ▴</span>':'')
    +'</div><div class="acts sqa">'
    +'<button title="move up" onclick="seqUp(\''+x.id+'\')">↑</button>'
    +moves.map(m=>'<button title="move to '+m[0]+'" onclick="moveSeq(\''+x.id+'\',\''+m[0]+'\')">'+m[1]+'</button>').join('')
    +'<button onclick="editSeq(\''+x.id+'\')">✎</button>'
    +'<button class="pri" onclick="doneSeq(\''+x.id+'\')">\u2713</button>'
    +'</div></div></div>';
}

    const items=box().sequence.filter(x=>x.bucket===b[0]&&!x.done);
    h+='<div class="'+b[0]+'" data-bucket="'+b[0]+'" style="min-height:60px"><div class="colh">'+b[1]+'<span class="cnt">'+items.length+'</span></div>';
    h+=items.length?items.map(seqItem).join(''):'<div class="empty">Drop here or use the → buttons</div>';

/* Gemini 2.5 family only — Flash for audio/analysis, Flash-Lite for light extraction.
   The "-latest" aliases point at the same 2.5 models and are kept as fallbacks. */
const GEM_MODELS=['gemini-2.5-flash','gemini-2.5-flash-lite','gemini-flash-latest','gemini-flash-lite-latest'];
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function gemini(parts,opts){
  opts=opts||{};
  if(!S.meta.aiKey)throw new Error('No Gemini key — Data tab → AI power');
  const order=[...new Set([opts.prefer,S.meta.aiModel,...GEM_MODELS].filter(Boolean))];
  /* When Google is congested, hopping to another 2.5 model beats waiting on the busy one.
     Pass 1: try each model once. Pass 2: come back with longer waits. */
  const notes=[];let busy=false;const deadline=Date.now()+20000;
  const plan=[];
  order.forEach(m=>plan.push({m,wait:0}));
  order.forEach(m=>plan.push({m,wait:2500}));
  order.forEach(m=>plan.push({m,wait:4000}));
  let step=0;
  for(const {m,wait} of plan){
    step++;
    if(Date.now()>deadline){busy=true;break;}
    if(wait){if(opts.onRetry)opts.onRetry(step,m);await sleep(wait);}
    try{
      const r=await fetch('https://generativelanguage.googleapis.com/v1beta/models/'+m+':generateContent?key='+encodeURIComponent(S.meta.aiKey),
        {method:'POST',headers:{'Content-Type':'application/json'},
         body:JSON.stringify({contents:[{parts}],generationConfig:{temperature:opts.temp||0,responseMimeType:'application/json'}})});
      if(r.status===404||r.status===400||r.status===403){notes.push(m+'→'+r.status);continue;}
      if(r.status===503||r.status===429||r.status===500){busy=true;notes.push(m+'→'+r.status);if(opts.onRetry)opts.onRetry(step,m);continue;}
      if(!r.ok){notes.push(m+'→'+r.status);continue;}
      const j=await r.json();
      const txt=j&&j.candidates&&j.candidates[0]&&j.candidates[0].content&&j.candidates[0].content.parts[0].text;
      if(!txt){notes.push(m+'→empty');continue;}
      if(S.meta.aiModel!==m){S.meta.aiModel=m;localStorage.setItem(LS_KEY,JSON.stringify(S));}
      return JSON.parse(txt);
    }catch(e){notes.push(m+'→'+(e.message||'err'));}
  }
  if(busy)throw new Error('Google’s AI servers are busy right now (503). Your key is fine — wait a few seconds and tap again. Long recordings hit this more often; a shorter clip or pasted notes will go through.');
  throw new Error('No working model on your key ('+notes.slice(0,3).join(', ')+'). Check the key in Data → AI power.');
}

/* ---------- RELATIONSHIP TRAIL: every touch, in order ---------- */
function trailFor(kind,obj){
  const T=[];
  const names=kind==='clinic'?[obj.name,...(obj.doctors||[]),obj.whoAnswers].filter(Boolean):[obj.name];
  const isMine=n=>names.some(x=>nameEq(x,n)||x===n);
  (obj.visits||[]).forEach(v=>T.push({date:v.date,time:v.time||'',ts:v.ts,type:'visit',title:'Visit',body:v.note||''}));
  (obj.calls||[]).forEach(c=>T.push({date:c.date,ts:c.ts,type:'call',title:'Conversation'+(c.src==='recording'?' (recording)':''),body:c.summary||'',points:c.points||[],objections:c.objections||[],pricing:c.pricing||[],next:c.nextStep||'',sentiment:c.sentiment||'',tags:c.tags||[],callId:c.id,ownerId:obj.id,ownerKind:kind}));
  (obj.stageHistory||[]).forEach(s=>T.push({date:s.date,ts:s.ts,type:'stage',title:'Stage → '+s.stage,body:''}));
  [...S.followups,...S.me.followups].forEach(f=>{
    if(!isMine(f.who))return;
    T.push({date:f.created||f.due||'',ts:f.ts,type:'promise',title:(f.done?'Promise kept: ':'Promise: ')+f.text,body:f.due?('due '+fmtDs(f.due)):''});
  });
  S.sequence.filter(t=>isMine(t.link)).forEach(t=>T.push({date:t.created||'',ts:t.ts,type:'task',title:(t.done?'Done: ':'Task: ')+t.title,body:t.notes||''}));
  return T.map((x,i)=>Object.assign(x,{date:normDate(x.date),_i:i}))
    .filter(x=>x.date)
    .sort((a,b)=>b.date.localeCompare(a.date)||(b.time||hhmm(b.ts)||'').localeCompare(a.time||hhmm(a.ts)||'')||b._i-a._i);
}
function trailHTML(kind,obj){
  const T=trailFor(kind,obj);
  if(!T.length)return '<div class="empty">No history yet. Log a visit or a conversation.</div>';
  const col={visit:'#BE185D',call:'#0F766E',stage:'#0369A1',promise:'#B4711F',task:'#4D7C0F'};
  let h='<div class="tl">',lastM='';
  T.forEach(e=>{
    const m=new Date(e.date+'T00:00').toLocaleDateString('en-IN',{month:'long',year:'numeric'});
    if(m!==lastM){h+='<div class="tlmonth">'+m+'</div>';lastM=m;}
    h+='<div class="tle"><div class="tdot" style="background:'+(col[e.type]||'#78716C')+'"></div>'
      +'<div class="tt">'+esc(e.title)+'</div>'
      +'<div class="tm">'+whenLabel(e.date,e.time,e.ts)+'</div>'
      +(e.body?'<div class="m">'+esc(e.body)+'</div>':'')
      +((e.points&&e.points.length)?'<div class="m">'+e.points.map(p=>'• '+esc(p)).join('<br>')+'</div>':'')
      +((e.objections&&e.objections.length)?'<div class="m"><span class="pill amber">objection</span> '+e.objections.map(esc).join(' · ')+'</div>':'')
      +((e.pricing&&e.pricing.length)?'<div class="m"><span class="pill">pricing</span> '+e.pricing.map(esc).join(' · ')+'</div>':'')
      +(e.next?'<div class="m"><b>Next:</b> '+esc(e.next)+'</div>':'')
      +(e.callId?'<div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">'+tagPills(e.tags)
        +'<button class="btn sm sec" style="padding:2px 8px;font-size:11px;margin-top:5px" onclick="editTags(\''+e.ownerKind+'\',\''+e.ownerId+'\',\''+e.callId+'\')">tags</button></div>':tagPills(e.tags))
      +'</div>';
  });
  return h+'</div>';
}
function relAnalysis(kind,obj){
  const T=trailFor(kind,obj);
  if(!T.length)return '';
  const visits=T.filter(x=>x.type==='visit'),calls=T.filter(x=>x.type==='call');
  const touches=visits.length+calls.length;
  const first=T[T.length-1].date,last=T[0].date;
  const span=Math.max(1,Math.round((new Date(last)-new Date(first))/864e5));
  const gap=touches>1?Math.round(span/(touches-1)):null;
  const sinceTouch=daysAgo(last);
  const objs=[],prices=[];
  calls.forEach(c=>{(c.objections||[]).forEach(o=>objs.push(o));(c.pricing||[]).forEach(p=>prices.push(p));});
  const openProm=[...S.followups,...S.me.followups].filter(f=>!f.done&&(kind==='clinic'?[obj.name,...(obj.doctors||[]),obj.whoAnswers].filter(Boolean):[obj.name]).some(n=>nameEq(n,f.who)));
  const overdue=openProm.filter(f=>f.due&&daysTo(f.due)<0);
  const stages=(obj.stageHistory||[]).length;
  let temp='steady',tcls='';
  if(sinceTouch>21){temp='going cold';tcls='bad';}
  else if(sinceTouch>10){temp='cooling';tcls='warn';}
  else if(touches>=3&&gap&&gap<=10){temp='warm and moving';tcls='good';}
  let h='<div class="card" style="margin-bottom:12px"><b style="font-size:13px">Relationship read</b>'
    +'<div class="grid g4" style="margin-top:8px">'
    +stat(touches,'touches','')+stat(sinceTouch+'d','since last','')+stat(gap?gap+'d':'—','avg gap','')+stat(openProm.length,'open promises',overdue.length?'warn':'')
    +'</div>'
    +'<div class="hl '+(tcls||'info')+'" style="margin-top:10px"><i class="dot"></i><div>'
    +'<b>'+temp[0].toUpperCase()+temp.slice(1)+'.</b> '
    +touches+' touch'+(touches>1?'es':'')+' over '+span+' days'+(gap?', roughly every '+gap+' days':'')+'. Last contact '+sinceTouch+' days ago'
    +(stages>1?'. Moved through '+stages+' stages':'')+'.'
    +(overdue.length?' <b>'+overdue.length+' promise'+(overdue.length>1?'s':'')+' overdue — fix before the next visit.</b>':'')
    +(sinceTouch>14?' At this gap, the relationship is running on memory, not momentum.':'')
    +'</div></div>';
  if(objs.length)h+='<div class="m" style="margin-top:8px"><b>Recurring objections:</b> '+objs.slice(0,4).map(esc).join(' · ')+'</div>';
  if(prices.length)h+='<div class="m"><b>Pricing signals:</b> '+prices.slice(0,4).map(esc).join(' · ')+'</div>';
  return h+'</div>';
}

/* ---------- CONVERSATION TAGS: turn talk into buckets ---------- */
function backfillTags(){
  let n=0;
  const doIt=arr=>(arr||[]).forEach(o=>(o.calls||[]).forEach(v=>{
    if(!v.tags||!v.tags.length){
      v.tags=ruleTags([v.summary,(v.points||[]).join(' '),(v.objections||[]).join(' '),(v.pricing||[]).join(' '),v.nextStep].join(' '));
      if(v.objections&&v.objections.length&&!v.tags.includes('Objection'))v.tags.push('Objection');
      if(v.pricing&&v.pricing.length&&!v.tags.includes('Pricing'))v.tags.push('Pricing');
      n++;
    }
  }));
  doIt(S.clinics);doIt(S.people);
  if(n){localStorage.setItem(LS_KEY,JSON.stringify(S));}
  return n;
}
function editTags(kind,ownerId,callId){
  const o=kind==='clinic'?S.clinics.find(x=>x.id===ownerId):S.people.find(x=>x.id===ownerId);
  const c=o&&(o.calls||[]).find(x=>x.id===callId);if(!c)return;

    +'<div class="note" style="margin-bottom:8px">'+esc((c.summary||'').slice(0,120))+'</div>'

}

function retagAll(){

  doIt(S.clinics);doIt(S.people);
  const n=backfillTags();

const CONV_TAGS=['Profile','Feature request','Pricing','Objection','Recordings shared','Referral','Competitor','Consent / DPDP','Handset','Demo / audit','Commitment','Timing','Renewal risk','Intro'];
const TAG_RULES=[
 ['Feature request',/\b(want|wants|wanted|needs?|asking for|requirement|feature|integration|whatsapp|reminder engine|follow ?up engine|dashboard)\b/i],
 ['Pricing',/\b(price|pricing|cost|rate|₹|rs\.?|budget|quote|quoted|discount|per month|willing to (spend|pay)|invest)\b/i],
 ['Objection',/\b(worried|concern|hesitant|not sure|doubt|expensive|too high|later|after diwali|no need|already have)\b/i],
 ['Recordings shared',/\b(recording|recordings|audio|shared calls?|sample calls?|call data)\b/i],
 ['Referral',/\b(refer|referral|introduce|introduction|recommend|association|IMA|network|connect me)\b/i],
 ['Competitor',/\b(competitor|another vendor|other company|bengaluru vendor|alternative|comparing)\b/i],
 ['Consent / DPDP',/\b(consent|privacy|dpdp|legal|patient data|recording permission)\b/i],
 ['Handset',/\b(phone|handset|samsung|vivo|oppo|realme|redmi|motorola|pixel|iphone|record unknown|call recording setting)\b/i],
 ['Demo / audit',/\b(demo|audit|trial|pilot|test|show(ed|ing)? (the|him|her)|7[- ]day)\b/i],
 ['Profile',/\b(reputed|top \d|senior|runs|practice since|years of|specialis|association|friendly|supports? (his|her) (staff|front desk))\b/i],
 ['Timing',/\b(next week|next month|after|diwali|festival|busy season|come back|revisit|month end)\b/i],
 ['Renewal risk',/\b(cancel|stop|not using|unhappy|complaint|not working|drop)\b/i],
 ['Intro',/\b(first meeting|introduce|introduction|met for the first time|reach out|pitch)\b/i]
];
function ruleTags(text){
  const t=[];
  TAG_RULES.forEach(([tag,re])=>{if(re.test(text||''))t.push(tag);});
  return [...new Set(t)].slice(0,4);
}
function convTagsFrom(o){
  const blob=[o.summary,(o.points||[]).join(' '),(o.objections||[]).join(' '),(o.pricing||[]).join(' '),o.nextStep].join(' ');
  const fromAI=(o.tags||[]).filter(t=>CONV_TAGS.includes(t));
  const merged=[...new Set([...fromAI,...ruleTags(blob)])];
  if(o.objections&&o.objections.length&&!merged.includes('Objection'))merged.push('Objection');
  if(o.pricing&&o.pricing.length&&!merged.includes('Pricing'))merged.push('Pricing');
  if(o.commitments&&o.commitments.length&&!merged.includes('Commitment'))merged.push('Commitment');
  return merged.slice(0,5);
}
function tagPills(tags){
  if(!tags||!tags.length)return '';
  const col={'Feature request':'violet','Pricing':'','Objection':'amber','Renewal risk':'red','Referral':'green','Recordings shared':'green','Consent / DPDP':'amber','Competitor':'red'};
  return '<div style="display:flex;gap:5px;flex-wrap:wrap;margin-top:5px">'+tags.map(t=>'<span class="pill '+(col[t]||'grey')+'">'+esc(t)+'</span>').join('')+'</div>';
}

function fileToB64(f){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(',')[1]);r.onerror=rej;r.readAsDataURL(f);});}
async function toggleConvRec(){
  if(rec.mr&&rec.mr.state==='recording'){stopRec();return;}
  await toggleRec();
  if(rec.mr)rec.mr.onstop=()=>{
    rec.blob=new Blob(rec.chunks,{type:rec.mime});
    try{rec.mr.stream.getTracks().forEach(t=>t.stop());}catch(e){}
    clearInterval(rec.timer);
    const b=$('recbtn'),t=$('rectime');
    if(b){b.textContent='✓';b.style.background='var(--green)';}
    if(t)t.textContent='Recorded '+fmtSecs((Date.now()-rec.t0)/1000)+' — reading it now…';
    convRun();
  };
}
async function convRun(){
  const f=(rec.blob?new File([rec.blob],'rec.webm',{type:rec.mime}):null)||($('cvfile')&&$('cvfile').files[0]);
  const txt=($('cvtxt')&&$('cvtxt').value||'').trim();
  const date=($('cvdate')&&$('cvdate').value)||todayISO();
  if(!f&&!txt){toast('Add a recording or some text');return;}
  if(!S.meta.aiKey){alert('This needs your Gemini key — Data tab → AI power.');return;}
  if(f&&f.size>18*1024*1024){alert('That file is '+(f.size/1048576).toFixed(1)+' MB. Keep recordings under ~18 MB (about 10 minutes) — or paste the transcript instead.');return;}
  $('modal').innerHTML='<h3>Listening…</h3><div class="note">'+(f?'Transcribing and extracting. A few-minute call takes ~20–40 seconds.':'Extracting the key points.')+'</div>';
  const known=S.people.slice(0,25).map(p=>p.name).join('; ');
  const instruction='Sales conversation between Vinay (founder, DeskLens — AI call intelligence for Indian clinics, ₹6,000/month, sells via a free 7-day call audit) and people at "'+conv.name+'". Today is '+todayISO()+'. Known contacts: '+known+'.\n'
    +'Extract only what was said; never invent. JSON only:\n'
    +'{"summary":"3-4 sentences","points":["facts worth remembering"],'
    +'"commitments":[{"who":"Vinay or their name","what":"promise","due":"YYYY-MM-DD or empty"}],'
    +'"objections":["pushback in their words"],"pricing":["price/budget/competitor mentions"],'
    +'"people":[{"name":"","role":""}],"nextStep":"clearest next action",'
    +'"tags":["pick 1-4 from: '+CONV_TAGS.join(', ')+'"],'
    +'"suggestedStage":"Lead|Audit (7-day)|Design Partner|Pilot|Paying|Renewed|","sentimentNote":"one line on how warm or hesitant"}';
  try{
    const parts=[{text:instruction}];
    if(txt)parts.push({text:'\n\nTRANSCRIPT / NOTES:\n'+txt});
    if(f)parts.push({inline_data:{mime_type:(f.type||'audio/mpeg').split(';')[0],data:await fileToB64(f)}});
    conv.out=await gemini(parts,{temp:0.1,prefer:'gemini-2.5-flash',onRetry:(n,mdl)=>{
      const m=$('modal');
      if(m)m.innerHTML='<h3>Google’s AI is busy…</h3><div class="note">Trying another 2.5 model ('+esc(mdl||'')+'). Attempt '+n+'. Your text is safe — nothing is lost.</div>';

      +'<div class="note" style="margin-bottom:10px">'+esc(e.message)+'</div>'
      +(busy?'<div class="hl warn"><i class="dot"></i><div>This is Google’s side, not your key or your notes. Your text is saved below — tap Try again in a few seconds, it usually goes through.</div></div>':'')
      +'<div class="f" style="margin-top:10px"><label>Your notes (kept safe)</label><textarea id="cvtxt" style="min-height:110px">'+esc(txt||'')+'</textarea></div>'
      +'<input type="hidden" id="cvdate" value="'+esc(date)+'">'
      +'<div class="mbtns"><button class="btn sec" onclick="convSaveRaw()">Save notes as-is</button><button class="btn" onclick="convRun()">Try again</button></div>';

/* ---------- DAILY COACH ----------
   Layer 1: deterministic engine scores real opportunities using Vinay's own strategy rules.
   Layer 2: Gemini sequences + explains them, grounded ONLY in these facts (cannot invent).      */
function coachCandidates(){
  const C=[],live=liveCount(),paying=payingCount();
  const push=(score,kind,action,why,act)=>C.push({score,kind,action,why,act});

  // 1. Overdue follow-ups — promises are the cheapest trust to lose
  openFU().filter(f=>f.due&&daysTo(f.due)<0).forEach(f=>{
    const d=-daysTo(f.due);
    push(100+Math.min(d*3,40),'promise','Close: '+f.text+(f.who?' ('+f.who+')':''),
      'Promised for '+fmtDs(f.due)+', now '+d+' day'+(d>1?'s':'')+' late. Slipping promises is how tier-2 relationships quietly die.',
      f.who?{t:'person',n:f.who}:null);
  });

  // 2. Active clinic, recording not verified — hard gate, blocks everything downstream
  S.clinics.filter(c=>ACTIVE_STAGES.includes(c.stage)&&c.handset!=='ok').forEach(c=>{
    push(95,'blocker','Run the recording test call at '+c.name,
      'Stage is '+c.stage+' but the test call isn\'t verified'+(c.brand?'':' and the handset brand is unknown')+'. Until this passes, DeskLens cannot produce a single call for them.',
      {t:'clinic',id:c.id});
  });

  // 3. Partial-recording handsets at active clinics — expectation risk
  S.clinics.filter(c=>ACTIVE_STAGES.includes(c.stage)&&PARTIAL_BRANDS.includes(c.brand)).forEach(c=>{
    push(80,'risk','Confirm "Record Unknown Numbers" is ON at '+c.name,
      c.brand+' captures only unknown-number incoming calls. Their data will be partial — say it before they discover it.',
      {t:'clinic',id:c.id});
  });

  // 4. Audit clinics — the 7-day window is the sales motion; it must close
  S.clinics.filter(c=>c.stage==='Audit (7-day)').forEach(c=>{
    const lv=lastVisit(c),age=lv?daysAgo(lv):null;
    push(90,'close','Take the audit results back to '+c.name,
      'Free 7-day audit is your closing motion'+(age!==null?', and it\'s been '+age+' days since you were there':'')+'. Proof in hand converts better than any pitch.',
      {t:'clinic',id:c.id});
  });

  // 5. Quiet active clinics — the field is the moat
  S.clinics.filter(c=>['Design Partner','Pilot'].includes(c.stage)).forEach(c=>{
    const lv=lastVisit(c),d=lv?daysAgo(lv):999;
    if(d>=10)push(70+Math.min(d,25),'field','Visit '+c.name+(c.doctors&&c.doctors[0]?' — '+c.doctors[0]:''),
      lv?('No visit logged in '+d+' days. Design partners go cold quietly.'):'No visit ever logged. Presence is the only thing a competitor can\'t copy.',
      {t:'clinic',id:c.id});
  });

  // 6. High-value leads never approached — where founder-time compounds
  S.clinics.filter(c=>c.stage==='Lead'&&parseInt(c.reviews||0)>=100&&!c.visits.length).forEach(c=>{
    push(60+Math.min(parseInt(c.reviews)/50,20),'growth','Approach '+c.name+' ('+c.reviews+' reviews)',
      'High review count means high call volume — the clinics that feel the missed-call problem most. Offer the free 7-day audit.',
      {t:'clinic',id:c.id});
  });

  // 7. High-influence people with nothing planned — unopened doors
  S.people.filter(p=>(p.influence||'').startsWith('High')&&!openFU().some(f=>nameEq(f.who,p.name))).forEach(p=>{
    push(65,'leverage','Line up an ask with '+p.name,
      'Marked high influence but nothing is scheduled. Referral introductions are your cheapest path to clinic 15.',
      {t:'person',id:p.id});
  });

  // 8. Karthik blockers — build velocity
  S.questions.filter(q=>q.status==='open'&&daysAgo(q.created)>=7).forEach(q=>{
    push(72,'build','Get an answer from '+q.withWhom+': '+q.q,
      'Open '+daysAgo(q.created)+' days. Architecture and compliance questions compound — every day unanswered is a day of possible rework.',
      null);
  });

  // 9. Gate awareness
  if(live<3)push(55,'gate','Push one clinic to pilot — you are at '+live+' of 3',
    'Gate 1 is three live clinics. Everything after it (partners, reps, pricing confidence) waits on this number.',null);
  else if(live<15)push(50,'gate',(15-live)+' clinics to the partner-activation gate',
    'You are at '+live+' live. Founder-direct until 15 — that is the rule that keeps distribution learnable.',null);

  // 10. Missing intelligence that shapes decisions
  const noRev=S.clinics.filter(c=>ACTIVE_STAGES.includes(c.stage)&&!c.reviews);
  if(noRev.length)push(40,'data','Look up review counts for '+noRev.length+' active clinic'+(noRev.length>1?'s':''),
    'Review count is your call-volume proxy — without it you cannot rank where to spend the next visit.',null);

  // 11. Personal world
  S.me.followups.filter(f=>!f.done&&f.due&&daysTo(f.due)<0).forEach(f=>{
    push(58,'personal','Personal: '+f.text,'Overdue since '+fmtDs(f.due)+'. Founder life leaks into founder judgement.',null);
  });

  // 12. Hygiene
  const bk=S.meta.lastBackup?daysAgo(S.meta.lastBackup):999;
  if(bk>10)push(35,'hygiene','Take a backup','Last backup '+(S.meta.lastBackup?bk+' days ago':'never')+'. Sync covers device loss, backups cover mistakes.',null);

  return C.sort((a,b)=>b.score-a.score);
}
